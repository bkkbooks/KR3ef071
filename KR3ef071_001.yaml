body:
  text: 卷之上論六經脈證治法太陽經脈證治法經曰太陽之為病脈浮頭項強痛而惡寒內經曰傷寒一日巨陽受之巨陽者諸陽之所屬也其脈連於風府故為諸陽主氣也故頭項痛腰脊強太陽者足膀胱壬寒水也一日巨陽其標熱其本寒此經行身之後從頭下至足乃有頭疼脊強惡風寒之證專主表是一身之綱維為諸陽之主氣四通八達貫五臟六腑之俞邪從此入能循經傳亦能越經傳治之若逆其變不可勝言矣其脈浮經曰尺寸俱浮者太陽受病也浮而緩者為中風風性解緩也浮而緊者為傷寒寒性勁急也其證有汗惡風者風傷衛為表虛宜解表內經曰汗出而身熱者風也無汗惡寒者寒傷營為表實宜發表凡太陽病發熱惡寒頭項痛腰脊強尺寸脈俱浮者此風寒中在經乃標病也宜汗之此證治之常也若惡寒而蜷身體疼痛脈反沉者此寒中在膀胱腑乃本病也宜溫之此證之變也經曰太陽中風陽浮而陰弱陽浮者熱自發陰弱者汗自出嗇嗇惡寒淅淅惡風翕翕發熱鼻鳴乾嘔者桂枝湯主之其證常自汗出小便不數手足溫和或手足指稍露之則微冷覆之則溫渾身熱微煩而又憎寒可用桂枝湯若身無汗或小便數或手足逆冷或不惡寒反惡熱者勿與服經曰太陽病頭痛發熱身疼腰痛骨節疼痛惡風無汗而喘者麻黃湯主之其證發熱無汗或喘骨節煩疼憎寒手足指末微厥掌心不厥可用麻黃湯若自汗出反惡熱者勿與服經曰太陽病項背強𠘧𠘧反汗出惡風者桂枝加葛根湯主之太陽病項背強𠘧𠘧無汗惡風葛根湯主之汗出惡風者中風表虛也故桂枝湯但加葛根一味治之無汗惡風者中風表實也故以葛根湯發汗經曰太陽中風脈浮緊發熱惡寒身疼痛不汗出而煩躁者大青龍湯主之若脈微弱汗出惡風者不可服服之則厥逆筋惕肉瞤此為逆也此中風見寒脈也識證之妙在不汗出煩躁五字若無煩躁乃麻黃湯證也傷寒脈浮緩身不疼但重乍有輕時無少陰證者大青龍湯發之此傷寒見風脈也識證之妙在無少陰證四字若有惡寒自利之裡證乃少陰四逆湯治也太陽病始得之只有此六證屬表可汗者也為病在經若發汗若吐若下後若二三日以後病者或傳經或只在本經或隨經入腑或入腑或汗吐下逆證又當各隨其脈證而治之不可與始得病者同論也經曰病發熱頭痛脈反沉若不瘥身體疼痛當救其里宜四逆湯此邪中太陽虛寒證也為病在本故宜溫之不可發汗吐下也下二證同又傷寒脈浮自汗出小便數心煩微惡寒腳攣急者此亦邪中太陽虛寒證所謂證象陽旦者也宜芍藥甘草附子湯若小便難者此真陽旦證亦太陽虛寒也宜桂枝加附子湯凡可汗證欲作湯藥不可逾時其發汗溫服湯藥方雖言日三服若病劇不解當促其間可半日中盡三服如服藥後病證猶在當復作本湯服之若可汗不汗或汗之不徹者邪傳於裡寒變為熱或衄或發黃或膀胱蓄血或大便硬譫語或小便不利諸熱證生矣經曰傷寒脈浮緊不發汗因致衄者麻黃湯主之傷寒不大便六七日頭痛有熱者與承氣湯其小便清者知不在裡乃在表也當發汗若頭痛者必衄宜桂枝湯太陽病脈浮緊無汗發熱身疼痛八九日不解表證仍在此當發其汗服藥已微汗其人發煩目瞑劇者必衄衄乃解所以然者陽氣重故也麻黃湯主之此三太陽證乃在本經不傳者也上二證是當汗不汗下一證是汗之不徹故致衄也蓋可汗不汗則邪無從出壅甚於經迫血妄行衄出於鼻鼻為肺竅手太陽之脈其支別者從頰上䪼抵鼻會足太陽之脈於目內眥熱久不解連手太陽同病也頭痛目瞑皆太陽脈之經也衄出解者針經曰奪血者無汗奪汗者無血汗即血也衄則熱隨血散矣桂枝麻黃湯非治衄藥也衄者不可發汗宜犀角地黃湯仲景贅桂枝麻黃湯於衄證之下者乃未衄之先宜服非用於衄之後也經曰太陽病發汗後大汗出胃中乾燥不得眠欲得飲水者少少與飲之令胃氣和則愈若脈浮小便不利微熱消渴者與五苓散主之此亦太陽本經病不傳者也言發汗後大汗出欲得飲水者責以胃中乾燥也少與之水以和胃氣若發汗後脈浮小便不利消渴者責以汗出不徹其邪隨經入腑而為尿澀之證也故用五苓散利之經曰太陽病不解熱結膀胱其人如狂血自下下者愈其外不解者尚未可攻當先解外外解已但少腹急結者乃可攻之宜桃仁承氣湯方此亦太陽本經病隨經入腑者也此言病不解見失汗也所以先解外而後攻之太陽病六七日表證仍在脈微而沉反不結胸其人發狂者以熱在下焦少腹當硬滿小便自利者下血乃愈所以然者以太陽隨經瘀熱在裡故也抵當湯主之此言表證仍在者見失汗也太陽病身黃脈沉結少腹硬小便不利者為無血也小便自利其人如狂者血證諦也抵當湯主之此亦太陽本經病隨經入腑者也此條當分二證皆失汗也夫風寒在表宜以汗散失汗則陽氣下陷以入於裡寒變為熱結於膀胱小便自利者氣行而血病也其經多血必為蓄血上下證同小便不利者氣滯而津液不行也津液不行復還於胃胃者濕土候在肌肉濕熱相合必發黃也茵陳蒿湯主之按此證如狂者輕發狂者重何以同如狂證而用藥反有峻緩耶蓋桃仁承氣湯中焦藥也乃蓄血在手太陽小腸兼有表邪里證尚微爾抵當湯下焦藥也乃蓄血在足太陽膀胱表入里里證獨急故耳傷寒有熱少腹滿應小便不利今反利者為有血也當下之不可余藥宜抵當丸此條表證既無里證又緩無身黃屎黑喜忘發狂是未至於甚也病在下焦非桃仁承氣湯所能治未至於甚不可遽用抵當湯故以抵當丸丸者緩也此上五證皆太陽隨經入腑為里證也可下之五苓散亦太陽里證之下藥也邪入於本用此利而去之經曰傷寒不大便六七日頭痛有熱者與承氣湯傷寒十三日不解過經譫語以有熱也當以湯下之此二證皆太陽本經病入胃者也謂之太陽陽明是矣用調胃承氣湯以和胃氣而愈凡與汗者必脈證可汗而後汗之若脈虛弱其證咽乾衄淋渴小便數及素有熱疾或胃有寒者雖見汗證別作區處不可與發汗汗之為逆經曰脈浮緊者法當身疼痛宜以汗解之假令尺中遲者不可發汗何以知之然以營氣不足血少故也此言脈之不可汗也咽喉乾燥者不可發汗淋家不可發汗發汗必便血小便出血衄家不可發汗汗出則額上陷脈急緊直視不能眴不得眠傷寒脈浮自汗出小便數心煩微惡寒腳攣急反與桂枝湯欲攻其表此誤也此皆言證之不可汗也其渴不可汗者以有裡熱也若酒客病不可與桂枝湯得湯則嘔以酒客不喜甘故也病人有寒復發汗胃中冷必吐蛔此二者言人素有熱疾寒疾者之不可用也經曰太陽病發汗太多因致痓經曰血虛則筋急汗多亡血不能養筋故筋急其背反張成痙也太陽病發汗遂漏不止其人惡風小便難四肢微急難以屈伸者桂枝加附子湯主之太陽氣不足因發汗陽氣益虛而成此證也太陽病發汗汗出不解其人仍發熱心下悸頭眩身瞤動振振欲擗地者真武湯主之此汗多亡陽證也以上三證皆汗之逆也此事難知集曰太陽禁忌不可犯小便不利不可使利之利之是謂犯本犯本則邪氣入里不能解此犯之輕也大便不易動動之是謂動血動血是謂犯禁此犯之重也表在不可下下之為逆此犯之尤重也經曰大下之後復發汗小便不利者亡津液故也勿治之得小便利必自愈不可利小便指汗後之證也若桂枝湯證又不喜小便利矣蓋汗後脈浮小便不利而渴者宜用五苓散利之不利則邪熱入胃而發黃也必脈微澀遲弱者因汗下亡去津液小便不利非若以上虛寒裡熱之證五苓散忌藥也強與利之是謂犯本重亡津液而成蓄血之證矣此所以禁利小便也經曰傷寒五六日頭汗出微惡寒手足冷心下滿口不欲食大便硬脈細者此為陽微結必有表復有里也脈沉亦在裡也汗出為陽微假令純陰結不得復有外證悉入在裡此為半在裡半在外也脈雖沉緊不得為少陰病所以然者陰不得有汗今頭汗出故知非少陰也可與小柴胡湯設不了了者得屎而解此太陽本經病漸入里者也傷寒五六日當入里之時也頭汗出微惡寒手足冷心下滿口不欲食大便硬言其證也脈細言其脈也可與小柴胡湯設不了了者得屎而解言其治也中間卻有許多比論者蓋因大便硬恐人誤作純陽結又脈細恐人誤作純陰結與少陰證也夫大便硬為純陽結此為陽微結以有表復有里也設使脈沉為在裡有汗出證只可為陽微結也若純陽結則無汗出之證矣此所以斷其必為陽微結也假令脈沉細大便硬欲作純陰結而治則不當復有外證如汗出惡寒者悉入在裡也今有表復有里必斷其非純陰結也少陰之脈沉而細今脈沉緊不得為少陰病者以陰不得汗頭汗出故知非少陰證是陽微結之候也先與小柴胡湯以除表裡之邪邪則了了而和解矣尚不了了者乃與湯取其微利也大便不易動者言可下之證也以在太陽經雖有下證不可大下恐下多則亡血也故忌之此謂與湯取其微利而不言方者不過以小柴胡加芒硝湯或以大柴胡湯利之也經曰太陽病外證未解者不可下也下之為逆此以下皆言下之逆證也太陽病下之其脈促不結胸者此為欲解也脈浮者必結胸也脈緊者必咽痛脈弦者必兩脅拘急脈細數者頭痛未止脈沉緊者必欲嘔脈沉滑者協熱利脈浮滑者必下血下後諸證病發於陽而反下之熱入因作結胸病發於陰而反下之因作痞所以成結胸者以下之太早故也表為陽里為陰假如桂枝麻黃湯證邪在表宜汗反下之則里之正氣為下所損而表之餘邪乘虛以入於裡結於心下為結胸又如柴胡湯證邪在半表半裡宜和解反下之里之微邪雖除而表之餘邪乘虛又入雖不成結胸亦成痞也表邪若甚則又為結胸也太陽病脈浮而動數浮則為風數則為熱動則為痛數則為虛頭痛發熱微盜汗出而反惡寒者表未解也醫反下之動數變遲膈內拒痛胃中空虛客氣動膈短氣躁煩心中懊憹陽氣內陷心下因硬則為結胸大陷胸湯主之若不結胸但頭汗出余處無汗齊頸而還身必發黃也此條分二證太陽病至表未解也言當發汗醫反下之治之逆也動數變遲以下十句言其病發於陽而下之熱入因作結胸之候也若不結胸以下言其當汗不汗熱不得越而發黃之候也此亦太陽本經自病失於汗下之逆證也太陽病重發汗而復下之不大便五六日舌上燥而渴日晡時小有潮熱從心下至少腹硬滿而痛不可近者大陷胸湯主之上言病在表當發汗反下熱入因作結胸此言重發汗則表應解矣復下之必有可下之證何以覆成結胸也經曰如服一劑病證猶在故當復作本湯治之至有不肯汗出服三劑乃解此言重發汗復下之必因汗之不解不與消息表邪有無謂汗不能去其熱而反下之表之熱邪乘虛入里故亦成結胸也從心下至少腹硬滿而痛不可近者此大結胸之狀也小結胸病正在心下按之則痛脈浮滑者小陷胸湯主之此承上文而言邪之甚者入里則成大結胸邪之微者入里則成小結胸曰正在心下按之則痛而陷胸之大小分矣傷寒五六日嘔而發熱者柴胡證具而以他藥下之柴胡證仍在者復與柴胡湯此雖已下之不為逆必蒸蒸而振卻發熱汗出而解若心下滿而硬痛者此為結胸也大陷胸湯主之但滿而不痛者此為痞柴胡不中與之宜半夏瀉心湯此太陽之邪傳於少陽法當和而反下之逆也五六日邪傳裡之時也嘔而發熱邪在半表半裡乃少陽柴胡證也當和解之醫反下之設使下後柴胡證仍在者復與柴胡湯和解之下之不為逆者有里證也若下後柴胡證罷心下滿而硬痛者此太陽在表之邪多所謂病發於陽而反下之熱入因作結胸也但滿而不痛者此少陽半表半裡之邪所謂病發於陰而反下之因作痞也當從結胸與痞論故曰柴胡不中與之觀心下滿而硬痛與滿而不痛而結胸痞氣別矣脈浮而緊而復下之緊反入里則作痞按之自濡但氣痞耳心下痞按之濡其脈關上浮者大黃黃連瀉心湯主之上言作痞之由下言治痞之方按心下滿而不痛者此里之正氣已虛邪氣作實故於攻痞之藥內加入人參大棗者補正氣也心下濡者正氣尚強邪氣未實但氣為邪所結自覺不暢異於常時耳故用大黃攻去邪氣不使留於心下以為正氣之賊也觀半夏瀉心湯與大黃黃連瀉心湯而痞之虛實別也心下痞而復惡寒汗出者加附子名附子瀉心湯結胸證其脈浮大者不可下下之則死結胸證寸脈浮關脈沉者可下傷寒大下後復發汗心下痞惡寒者表未解也不可攻痞當先解表表解乃可攻痞解表宜桂枝湯攻痞宜大黃黃連瀉心湯此二條乃治痞與結胸之法也凡結胸與痞無表證者便可攻之若結胸脈浮大者表邪未盡也下之則裡氣益虛邪氣復結不可解救所以死也不云解表用何方者以桂枝柴胡皆不中與宜少待之令表邪自解而後攻之也若痞則輕於結胸且有惡寒之證故先解表而後攻痞也使先攻痞則表邪復入痞變而成結胸矣問曰病有結胸有臟結其狀何如答曰按之痛寸脈浮關脈沉名曰結胸也何謂臟結答曰如結胸狀飲食如故時時下利寸脈浮關脈小細沉緊名曰臟結舌上白苔滑者難治此二者皆下後邪氣乘虛入里之證也邪氣入里與陽相結者為結胸與陰相結者為臟結結胸可治臟結不可治陽主生陰主殺也又結胸在心之分乃壬傳丁為夫傳妻故易治臟結在腎之分乃壬傳癸為兄傳妹故難治臟結無陽證不往來寒熱其人反靜舌上苔滑者不可攻也病脅下素有痞連在臍旁痛引少腹入陰筋者此名臟結死病在表而下之者上則為結胸下則臟結是臟結者亦太陽誤下之逆證也臟結舌上無白苔者可以調胃承氣湯微和胃氣則愈有白苔者不可妄攻也按結胸與痞皆下後逆證經曰所以成結胸者以下之太早故也何以只言結胸耶蓋少陽證亦有胸脅痞硬者恐人不知以結胸視之也故曾經下而痞硬者用結胸之法治之未經下而痞硬者用少陽證法治之經只言結胸者舉重以例輕也經曰病人有寒復發汗胃中冷必吐蛔此太陽汗後傳厥陰也經曰傷寒汗出解之後胃中不和心下痞硬乾噫食臭脅下有水氣腹中雷鳴下利者生薑瀉心湯主之此言汗後胃虛外傷陽氣之證也傷寒中風醫反下之其人下利日數十行穀不化腹中雷鳴心下痞硬而滿乾嘔心煩不得安醫見心下痞謂病不盡復下之其痞益甚此非結熱但以胃中虛客氣上逆故使硬也甘草瀉心湯主之此言下後胃虛內損陰氣之證也按此二證瀉心湯是半夏瀉心湯加減法也經曰得病六七日脈遲浮弱惡風寒手足溫醫二三下之不能食而脅下滿痛面目及身黃頸項強小便難者與柴胡湯後必下重本渴而飲水嘔者柴胡不中與也食谷者噦此言脈證不可下而下之逆證也嘔噦者少陽病也可與小柴胡湯此下後胃氣大弱不納水穀水入而嘔谷入而噦乃柴胡湯之戒也經曰太陽病桂枝湯證醫反下之利遂不止脈促者表未解也喘而汗出者葛根黃連黃芩湯主之此太陽本經病宜汗而下之逆證也太陽病二三日不能臥但欲起心下必結脈微弱者此本有寒分也反下之若利止必作結胸未止者四日復下之此作協熱利也此言太陽本經病邪在表而下之表邪乘虛入里利止則作結胸利不止則作協熱利也太陽病外證未除而數下之遂協熱而利利下不止心下痞硬表裡不解者桂枝人參湯主之此上三條皆言太陽本經病不宜下而下作協熱利之證也凡下後利不止而表邪甚者葛根黃連黃芩湯利不止而表解心下痞者甘草瀉心湯利不止心下痞而表裡不解者桂枝人參湯傷寒醫下之續得下利清穀不止身疼痛者急當救里後身疼痛清便自調者急當救表救里宜四逆湯救表宜桂枝湯此太陽誤下傳太陰證也上三證協熱而利以熱為本此證協寒而利以寒為本挾寒利為傳太陰挾熱者似傳少陰也經曰太陽病下之後脈促胸滿者桂枝去芍藥湯主之若微惡寒者去芍藥方中加附子湯主之此太陽經誤下而似結胸之證也按論中下後脈促者三證其言脈促不胸滿者欲解之候也脈促胸滿者不解之候也既不解則為結胸不得為結胸者以結胸之脈浮也故經曰脈浮者為結胸脈促胸滿者邪在裡也脈促喘而汗出者邪在表也此皆脈同而證異也經曰太陽病過經十餘日醫反二三下之後四五日柴胡證仍在者先與小柴胡湯嘔不止心下急鬱郁微煩者為未解也與大柴胡湯下之則愈此太陽越經傳少陽之證也所謂雖已下之不為逆而復可下之也傷寒十三日不解胸脅滿而嘔日晡所發潮熱已而微利此本柴胡證下之而不得利今反利者知醫以丸藥下之非其治也潮熱者實也先宜小柴胡湯以解外後以柴胡加芒硝湯主之此亦太陽越經傳少陽證而醫誤以丸藥下之者也傷寒十三日不解過經譫語者以有熱也當以湯下之若小便利者大便當硬而反下利脈調和者知醫以丸藥下之非其治也若自下利者脈當微厥今反和者此為內實也調胃承氣湯主之此太陽經入胃腑者也此上三證皆下後不為逆而復可下之者以日久不在太陽也經曰傷寒五六日大下之後身熱不去心中結痛者未欲解也梔子豆豉湯主之此言太陽本經病下後虛煩之證也若身熱去而心結痛結胸也以有身熱故知虛煩傷寒下後心煩腹滿臥起不安者梔子厚朴湯主之成氏注妙此以上皆言犯太陽禁忌之逆證也其未及者詳見下文經曰太陽病三日已發汗若吐若下若溫針仍不解者此為壞病桂枝不中與也觀其脈證知犯何逆隨證治之太陽病得之八九日如瘧狀發熱惡寒熱多寒少其人不嘔清便欲自可一日二三度發脈微緩者為欲愈也脈微而惡寒者此陰陽俱虛不可更發汗更下更吐也面色反有熱色者未欲解也以其不能得小汗出身必癢宜桂枝麻黃各半湯此節當分作四段看太陽病五句總言其證也為本節下三段及後二節之綱領也其人不嘔五句承言若得此證此脈為欲愈也脈微三句承言若得此脈此證不可妄治也面色以下承言若有此證宜用此治也若形如瘧日再發者汗出必解宜桂枝二麻黃一湯太陽病發熱惡寒熱多寒少脈微弱者此無陽也不可發汗宜桂枝二越婢一湯上節承上文之證而言若得此證宜用此治也下節即前節脈微者之治法也經曰太陽病初服桂枝湯反煩不解者先刺風池風府卻與桂枝湯則愈服桂枝湯大汗出脈洪大者與桂枝湯如前法服桂枝湯大汗出後大煩渴不解脈洪大者白虎加人參湯主之此太陽汗出不徹循經復轉陽明也白虎湯陽明和解藥也此三節皆汗後消息治法也不渴在表大渴入里經曰發汗已脈浮數煩渴者五苓散主之此太陽病渴表證未罷者也經曰傷寒脈浮發熱無汗其表不解者不可與白虎湯渴欲飲水無表證者白虎加人參湯主之此太陽病渴表證已罷而里證有熱者也傷寒無大熱口燥渴心煩背微惡寒者白虎加人參湯主之傷寒病若吐若下後七八日不解熱結在裡表裡俱熱時時惡風大渴舌上乾燥而煩欲飲水數升者白虎加人參湯主之上節言口燥渴心煩下節言大渴舌上乾燥而煩皆裡熱太甚證也惡風曰時時惡寒曰微在背則表邪輕矣所以用白虎湯不得謂表不解也大抵表未解而渴五苓散表已罷而渴白虎湯半表半裡而渴小柴胡去半夏加瓜蔞根湯經曰發汗吐下後虛煩不得眠若劇者必反復顛倒心中懊憹梔子豉湯主之若少氣者梔子甘草豉湯主之若嘔者梔子生薑豉湯主之傷寒醫以丸藥下之身熱不去微煩者梔子乾薑湯主之此證卻與前大下之後身熱不去心中結痛者異其法也凡用梔子湯病人舊微溏者不可與服之此皆言太陽經汗吐下後邪入胸中之證也經曰太陽病當惡寒發熱今自汗出不惡寒發熱關上脈細數者以醫吐之過也一二日吐之者腹中飢口不能食三四日吐之者不喜糜粥欲食冷食朝食暮吐以醫吐之所致也此為小逆此言太陽病以誤吐而傳陽明之證也太陽病吐之但太陽病當惡寒今反不惡寒不欲近衣此為吐之內煩也此亦太陽表病以吐而邪入傳陽明者也此二證以熱為主皆吐之逆也病人脈數數為熱當消穀引食而反吐者此以發汗令陽氣微膈氣虛脈乃數也數為客熱不能消穀以胃中虛冷故吐也經曰病如桂枝證頭不痛項不強寸脈微浮胸中痞硬氣上衝咽喉不得息者此為胸有寒也當吐之宜瓜蒂散此太陽里證吐藥也凡汗吐下後之證為虛煩用梔子豉湯吐之若未經發汗吐下又無表證者此實邪也用此吐之瓜蒂散猛劑也宜慎之經曰中風發熱六七日不解而煩有表裡證渴欲飲水水入則吐者名曰水逆五苓散主之經云發汗後飲水多必喘以水灌之亦喘皆太陽經之水逆證也經曰微數之脈慎不可灸因火為邪則為煩逆追虛逐實血散脈中火氣雖微內攻有力焦骨傷筋血難復也此下二節皆言火邪也脈浮熱甚反灸之此為表實實以虛治因火而動必咽燥唾血太陽病以火熏之不得汗其人必躁到經不解必清血名為火邪上節言火邪迫血上行也下節言火邪迫血下行也乃太陽經之火逆證也此以上皆言壞病也太陽經傳經欲解合併病脈證治法經曰傷寒一日太陽受之脈若靜者為不傳頗欲吐若躁煩脈數急者為傳也此言太陽寒邪變熱傳於陽明也為循經傳傷寒二三日陽明少陽證不見者為不傳也此只在太陽一經中也經曰傷寒五六日中風往來寒熱胸脅苦滿默默不欲飲食心煩喜嘔或胸中煩而不嘔或渴或腹中痛或脅下痞硬或心下悸小便不利或不渴身有微熱或咳者與小柴胡主之此言太陽之邪傳入少陽者也為越經傳傷寒中風有柴胡證但見一證便是不必悉具此教人臨病審證也凡柴胡病證而下之若柴胡證不罷者復與柴胡湯必蒸蒸而振發熱汗出而解凡振而汗解者太陽也不振而濈然汗出解者陽明也不振無汗解者少陽也經曰傷寒腹滿譫語寸口脈浮而緊此肝乘脾也名曰縱刺期門傷寒發熱嗇嗇惡寒大渴欲飲水其腹必滿自汗出小便利其病欲解此肝乘肺也名曰橫刺期門此二證皆太陽之邪傳厥陰名首尾傳經曰凡病若發汗若吐若下若亡津液陰陽自和者必自愈欲自解者必當先煩乃有汗而解何以知之脈浮故知汗出解也經曰脈浮而解者濈然汗出也脈數而解者必能食也脈微而解者必大汗出也此三節皆自解者也太陽病未解脈陰陽俱停必先振慄汗出而解但陽脈微者先汗出而解但陰脈微者下之而解若欲下之宜調胃承氣湯主之此言欲解之脈必待汗下而後解者也經曰太陽與陽明合病必自下利葛根湯主之合病者邪氣盛也二經同病曰合病太陽與陽明合病不下利但嘔者葛根加半夏湯主之太陽與陽明合病喘而胸滿者不可下宜麻黃湯主之此上三證太陽陽明合病皆不可下以有太陽而陽明在經故皆宜汗之用葛根麻黃湯太陽與少陽合病自下利者與黃芩湯若嘔者黃芩加半夏生薑湯主之凡合病必自下利或嘔者邪並於陽陽方主外而不主裡則裡氣虛氣下而不上者但下利而不嘔氣上逆而不下者但嘔而不利此二經合病以有少陽為在半表半裡非汗所宜故用黃芩湯和解三陽合病腹滿身重難以轉側口不仁而面垢譫語遺尿發汗則譫語下之則額上生汗手足逆冷若自汗出者白虎湯主之腹滿身重口不仁譫語陽明證也面垢少陽證也遺尿太陽證也三陽合病表裡有邪所以不可發汗下之也按三陽合病數其證而實之其二陽合病不言脈證只言某經與某經合病者蓋太陽病頭項痛腰脊強而脈浮陽明病目疼而鼻乾不得臥而脈大少陽胸脅痛而耳聾其脈弦凡遇兩經病一時齊見或嘔或下利者即合病也其三經病但見一證便是不必悉具仲景不言證非略也以論中包涵已盡不必再述況各經之證所見不一安可擬定而論哉經曰二陽並病太陽初得病時發其汗汗先出不徹因轉屬陽明續自微汗出不惡寒若太陽病證不罷者不可下下之為逆如此可小發汗設面色緣緣正赤者陽氣怫鬱在表當解之熏之若發汗不徹不足言陽氣怫鬱不得越當汗不汗其人躁煩不知痛處乍在腹中乍在四肢按之不可得其人短氣但以汗出不徹故也更發汗則愈何以知汗不徹以脈澀故知也太陽證罷但發潮熱手足漐漐汗出大便難而譫語者下之則愈宜大承氣湯並病論中甚明乃前後相併而不解病之傳者也非若合病則一時同病而不傳矣按三陽並病其下之則主其方其發汗則不主方愚謂若小發汗非葛根湯不可太陽與少陽並病頭項強痛或眩冒時如結胸心下痞硬者當刺大椎第一間肺俞肝俞慎不可發汗發汗則譫語脈弦五六日譫語不止當刺期門又曰慎勿下之下之成結胸心下硬下利不止水漿不入其人心煩此太陽越經傳少陽而相併也太陽病水氣附腹痛證治法經曰傷寒表不解心下有水氣乾嘔發熱而咳或渴或利或噎或小便不利少腹滿或喘者小青龍湯主之此太陽表證帶水者也太陽中風下利嘔逆表解者乃可攻之其人漐漐汗出發作有時頭痛心下痞硬滿引脅下痛乾嘔短氣汗出不惡寒者此表解里未和也十棗湯主之此太陽里證帶水者也經曰傷寒陽脈澀陰脈弦腹中急痛者先與小建中湯不瘥者與小柴胡湯主之小建中者腹痛虛寒在裡也小柴胡湯者腹痛邪氣自表入里裡氣不和也傷寒二三日心中悸而煩者小建中湯主之此不由汗下而悸煩者悸氣虛也煩血虛也氣血內虛故亦用建中湯治之凡汗後諸證經中自詳不必摘入外熱入血室證別見婦人傷寒脈證治法例陽明經脈證治法經曰尺寸俱長者陽明受病也當二三日發以其脈挾鼻絡於目故身熱目疼不得臥此本內經之文小變之也陽明者足胃戊土也其標濕其本燥此經行身之前從面下腹抵足乃有目疼鼻乾腹大滿實之證凡陽明專主裡俱宜下惟身熱微惡寒為病在經當汗之也自太陽傳來者名循經傳有本經自受病者能循經傳亦能越經傳不可不知也陽明胃又為中州之主無所不受六經之邪皆能入之但入謂之入腑入腑不復再傳矣其脈長而大經曰尺寸俱長者陽明受病也又曰傷寒三日陽明脈大長大而浮者為經病長大而沉者為腑病其證目痛鼻乾惡寒身熱者病在經宜解肌潮熱自汗譫語發渴便實不惡寒者病在腑宜下經曰陽明病若能食名中風不能食名中寒此言陽明本經自受風寒之證別也經曰本太陽初得病時發其汗汗先出不徹因轉屬陽明也此即太陽篇中服桂枝湯大汗出後大煩渴不解脈洪大者白虎加人參湯證也若無渴證微惡寒者葛根湯主之傷寒發熱無汗嘔不能食而反汗出濈濈然者是轉屬陽明也此即太陽篇中頗欲吐者為傳也胃經受邪則喜吐葛根加半夏湯主之傷寒轉系陽明者其人濈濈汗出也此上三條皆言太陽循經傳於陽明也經問曰病有太陽陽明有正陽陽明有少陽陽明何謂也答曰太陽陽明者脾約是也太陽經與陽明經齊病者曰合病先太陽經病未解陽明經病復同病者曰並病若太陽證罷只陽明經病見者曰傳經病如太陽經病不傳陽明經即入陽明胃腑者此太陽陽明也證治見下問曰何緣得陽明病答曰太陽病發汗若下若利小便此亡津液胃中乾燥因轉屬陽明不更衣內實大便難者此名陽明也此太陽之邪因汗下利小便轉入胃腑太陽陽明也太陽病三日發汗不解蒸蒸發熱者屬胃也調胃承氣湯主之太陽病若吐若下若發汗微煩小便數大便因硬者用小承氣和之愈此二條皆太陽陽明證治也經曰正陽陽明者胃家實是也邪自陽明經不傳少陽自入於腑乃本經自傳謂之正陽陽明正陽陽明者病火本風盛氣實津液消爍或始惡寒汗出多寒罷而反發熱或始得病便發熱妄言也證治見後少陽陽明者發汗利小便已胃中燥煩實大便難是也少陽經病不可發汗利小便若誤則邪入於胃又少陽經病不傳三陰即入胃腑者皆曰少陽陽明也證治見少陽中問曰陽明病外證云何答曰身熱汗自出不惡寒反惡熱也問曰病有得之一日不發熱而惡寒者何也答曰雖得之一日惡寒將自罷即自汗出而惡熱也此二條言陽明胃腑之表證也陽明之為病胃家實也此總結上三陽明之病云太陽陽明正陽陽明少陽陽明者胃家實是也問曰惡寒何故自罷答曰陽明居中土也萬物所歸無所復傳始雖惡寒二日自止此為陽明病也此言表邪入胃不復再傳之故也內經曰五臟者皆稟氣於胃胃者五臟之本也成氏注云胃為水穀之海主養四旁四旁有病皆能傳入於胃入胃則更不復傳不但太陽陽明少陽有入胃之證雖太陰少陰厥陰亦有入胃腑者不可不知也凡陽明病身熱微惡寒目眶痛鼻乾不得眠者此風寒在經乃表病也宜汗之經曰陽明病脈遲汗出多微惡寒者表未解也可發汗宜桂枝湯陽明病脈浮無汗而喘者發汗則愈宜麻黃湯此二條皆陽明在經證也經曰陽明病法多汗反無汗其身如蟲行皮中狀者以胃久虛故也太陽病身若癢者責其不能得汗也故用各半湯此陽明病身癢如蟲行者責其胃虛不能作汗也宜小建中湯凡陽明病潮熱自汗出譫語發渴去衣被揚手擲足斑黃狂亂不惡寒反怕熱大便實者此陽明腑病謂之在裡宜下之三承氣湯選而用之陽明屬胃其本燥非通泄不可必待表證已罷用承氣湯以疏利之則熱除燥潤而病瘳矣若惡寒未除則表邪尚在不可下也切須記此且病三焦俱傷則痞滿實堅燥俱全宜大承氣湯枳實苦寒以去痞厚朴苦溫以除滿芒硝鹹寒以潤燥軟堅大黃苦寒以泄實去熱病斯愈矣邪在中焦則有燥實堅三證故用調胃承氣湯以甘草和中芒硝潤燥大黃瀉實不用枳實恐傷上焦虛無氤氳之元氣調胃之名於此立也上焦受傷則為痞實用小承氣湯枳實厚朴除痞大黃泄實去芒硝則不傷下焦血分之真陰謂不伐其根也假令調胃承氣湯下之則瘥後元氣不復以其氣藥犯之也大承氣證用調胃承氣下之則瘥後神凝不清以其氣藥犯之也小承氣證用芒硝下之則利不止變而成虛矣經曰陽明病脈遲雖汗出不惡寒者其身必重短氣腹滿而喘有潮熱者此外欲解可攻裡也手足濈然而汗出者此大便已硬也大承氣湯主之若汗多微發熱惡寒者外未解也其熱不潮未可與承氣湯若腹大滿不通者可與小承氣湯微和胃氣勿令大泄下此陽明本經病入於腑乃正陽陽明也即前脈遲汗出多微惡寒桂枝證也陽明病潮熱大便微硬者可與大承氣湯不硬者不與之若不大便六七日恐有燥屎欲知之法少與小承氣湯湯入腹中轉矢氣者此有燥屎乃可攻之若不轉矢氣者此但初頭硬後必溏不可攻之攻之必脹滿不能食也欲飲水者與水則噦其後發熱者必大便復硬而少也以小承氣湯和之不轉矢氣者慎不可攻也此一條乃傷寒里證用下藥之秘法也傷寒若吐若下後不解不大便五六日上至十餘日日晡所發潮熱不惡寒獨語如見鬼狀若劇者發則不識人循衣摸床惕而不安微喘直視脈弦者生澀者死微者但發熱譫語者大承氣湯主之若一服利止不服經曰凡服藥不中病即止不必盡劑即此意也陽明病其人多汗以津液外出胃中燥大便必硬硬則譫語小承氣湯主之若一服譫語止更莫復服此亦正陽陽明也陽明病譫語發潮熱脈滑而疾者小承氣湯主之因與承氣湯一升腸中轉矢氣者更服一升若不轉矢氣勿更與之明日不大便脈反微澀者裡虛也為難治不可更與承氣湯也汗出譫語者以有燥屎在胃中此為實也須下之過經乃可下之下之若早語言必亂以表虛里實故也下之則愈宜大承氣湯經言胃中有燥屎屎貯於大腸尿貯於膀胱屎尿由小腸分別各從其道而貯何以燥屎反在胃中也蓋水穀入胃遊溢精氣以營百脈及其變化而糟粕津液則為屎尿人皆有之安能為病惟傷寒之邪入里寒化為熱熏蒸臟腑地道不通變化不行其水穀之在胃中者不能糟粕津液流行布散凝聚乾澀穀氣與邪氣相併以致發熱煩渴滿實急痛譫語狂亂此當下去之使地道通變化行燥屎去而病愈也但言胃則小腸大腸皆在其中矣得病二三日脈弱無太陽柴胡證煩躁心下硬至四五日雖能食以小承氣湯少少與微和之令小安五六日與承氣湯一升若不大便六七日小便少者雖不能食但初頭硬後必溏未定成硬攻之必溏須小便利屎定硬乃可攻之宜大承氣湯此上七條見古人於下證一事詳審斟酌不肯忽略之意秘法要旨非心領神會不可得也經曰陽明病不吐不下心煩者可與調胃承氣湯吐後心煩謂之內煩下後心煩謂之虛煩此心煩者以胃中鬱熱凌迫火位故爾心煩也陽明病譫語有潮熱反不能食者胃中必有燥屎五六枚也若能食者但硬耳宜大承氣湯下之此大承氣湯是治不能食胃中有燥屎之證非治能食但硬之證也病人不大便五六日繞臍痛煩躁發作有時者此有燥屎故使不大便也此因不大便繞臍痛煩躁發作知有燥屎在大腸中故使地道不通不得大便也方見下大下後六七日不大便煩不解腹滿痛者此有燥屎也所以然者本有宿食故也宜大承氣湯此二條皆言燥屎之證故並宜大承氣湯主之病人小便不利大便乍難乍易時有微熱喘冒不能臥者有燥屎也宜大承氣湯小便利則大便硬今大便乍難乍易則小便不利也此燥屎在胃中與上不同傷寒吐後腹脹滿者與調胃承氣湯內經曰諸脹腹大皆屬於熱傷寒六七日目中不了了睛不和無表裡證大便難身微熱者此為實也急下之宜大承氣湯不頭疼目痛惡寒此無表證也不腹痛發渴譫語此無里證也針經曰熱病目不明熱不已者死目中不明證近危惡故急用大承氣湯下陽明發熱汗多者急下之宜大承氣湯陽明證雖法多汗或濈濈然微汗出或手足濈濈然汗出此汗出太多則熱迫津液將竭正氣脫也故用大承氣湯急下之發汗不解腹滿痛者急下之宜大承氣湯熱病不以汗解腹滿而痛傳之急也腹滿不減減不足言當下之宜大承氣湯金匱要略曰腹滿時減復如故此為寒證屬太陰當與溫藥經曰大滿大實自可除下之腹滿不減此為實病屬陽明當與下之此上皆可下之證也經曰陽明證其人喜忘者必有蓄血所以然者本有久瘀血故令喜忘屎雖硬大便反易其色必黑宜抵當湯下之太陽蓄血則如狂者膀胱腎之腑也腎主志志亂則狂陽明蓄血則喜忘者胃脾之腑也脾主意意閉則忘針經曰腸胃實而心肺虛虛則營衛留於下久之不以時上故喜忘也膀胱貯尿蓄血則尿反快腸胃貯屎蓄血則屎反易病人無表裡證發熱七八日雖脈浮數者可下之假令已下脈數不解合熱則消穀善飢至六七日不大便者有瘀血宜抵當湯凡傷寒可下之證皆自表入里故下之今不言陽明病但言病人無表裡證是外不惡寒里無譫語非風寒自表而里之證乃脾胃內傷之病也經曰浮數之脈宜以汗解不可下也此非外感浮則傷胃數則傷脾至七八日發熱消爍津液正陽盛陰虛之時苟不攻之其熱不已而變生焉雖脈浮數可下之言不待脈候沉實而論也此內傷之證屬於脾胃又為下證故類編於陽明篇中然必合下三條同看乃見此脈證治法之詳備也若脈數不解而下不止必協熱而便膿血也此承上文乃陽明傳厥陰也趺陽脈遲而緩胃氣如經也趺陽脈浮而數浮則傷胃數則動脾此非本病醫特下之所為也營衛內陷其數先微脈反但浮其人必大便硬氣噫而除何以言之本以數脈動脾其數先微故知脾氣不治大便硬氣噫而除今脈反浮其數改微邪氣獨留心中則飢邪熱不殺穀潮熱發渴數脈當遲緩脈因前後度數如法病者則飢數脈不時則生惡瘡也此辨脈法篇中全文因與此篇脈證一例故並附之以便人之參考也陽明病下之其外有熱手足溫不結胸心中懊憹飢不能食但頭汗出者梔子豉湯主之此陽明病下後之證與上文證治宜同故並集之按此四條均是浮數之脈下後之證也蓋浮為熱客於氣數為熱客於血下之邪熱去而浮數之脈亦當解矣若下後數去而脈但浮者則營血間熱去而衛氣間熱在矣為邪氣獨留心中則飢邪熱不殺穀潮熱發渴之證經曰脈浮者必結胸也若不結胸心中懊憹飢不能食者主梔子豉湯吐之若下後浮去而脈數不解者則衛氣間熱去而營血間熱在矣為熱氣合併迫血下行消穀善飢之證血至下焦如大便利者必協熱而便膿血血盡乃愈如六七日不大便則血不得行蓄積於下為瘀血主抵當湯以下之若下後浮數之脈俱不解則邪氣不傳於裡鬱於營衛之中必生惡瘡也凡陽明病表邪未除里證未具者猶當和解之經曰陽明病發潮熱大便溏小便自可胸脅滿不去者小柴胡湯主之以潮熱知在胃凡大便溏者應氣降而胸脅滿去也以胸脅滿不去知其屬少陽也陽明病脅下硬滿不大便而嘔舌上白苔者可與小柴胡湯上焦得通津液得下胃氣因和身濈然而汗出解也腹滿不大便舌上苔黃者為陽明邪熱自入於腑可下脅滿不大便而嘔舌上苔白者為陽明邪氣傳入少陽宜和解之陽明中風脈弦浮大而短氣腹都滿脅下及心痛久按之氣不通鼻乾不得汗嗜臥一身及面目悉黃小便難有潮熱時時噦耳前後腫刺之小瘥外不解病過十日脈續浮者與小柴胡湯脈但浮無餘證者與麻黃湯若不尿腹滿加噦者不治此條當分作三治法如脈但浮大無諸里證者此邪在於經可與麻黃湯以汗之如脈弦大外證罷者此邪在於里可與大柴胡湯下之病過十日外不解脈續浮者此邪在半表半裡可與小柴胡湯和解之若不尿腹滿加噦此關格之病也太陽病寸緩關浮尺弱其人發熱汗出復惡寒不嘔但心下痞者此以醫下之也如其不下者病人不惡寒而渴者此轉屬陽明也小便數者大便必硬不更衣十日無所苦也渴欲飲水少少與之但以法救之渴者宜五苓散此條言太陽之邪漸傳於裡之證治也如嘔而心下痞者此邪在半表半裡乃小柴胡證不嘔但心下痞者此以下後邪氣留於心中乃梔子豉湯證如未經下者必漸入於胃而屬陽明也不惡寒而渴乃白虎加人參湯證惡寒而渴還屬太陽故主五苓散五苓散太陽藥也若陽明則豬苓湯然皆非小便數者所宜也若吐若下若發汗後小便數大便硬者當與小承氣湯和之此不因吐下發汗後小便數大便硬乃發熱汗出亡津液胃中乾燥故也若無滿實不可下之經曰今為小便數少以津液當還入胃中故知不久必大便也曰不更衣十日無所苦者只問其小便日幾行也陽明經傳經合病變證脈證治法經曰病人煩熱汗出則解又如瘧狀日晡所發熱者屬陽明也脈實者宜下之脈浮虛者宜發汗下之與大承氣湯發汗宜桂枝湯此陽明本經病證也脈浮虛者邪在於經故宜發汗脈實者邪入於腑故宜下陽明病欲食小便反不利大便自調其人骨節疼翕翕如有熱狀奄然發狂濈然汗出而解者此胃不勝穀氣與汗共並脈緊則愈此亦陽明本經病也凡陽明蘊熱為實者須下之熱氣散漫不為實者必待汗出而愈經曰陽明病脈浮而緊者必潮熱發作有時但浮者必盜汗出浮為在經緊為裡實陽明病裡熱者自汗表熱者盜汗盜汗者少陽病也此陽明經之邪傳於少陽也小柴胡湯經曰脈浮而遲表熱裡寒下利清穀者四逆湯主之此陽明傳少陰也經曰陽明病下血譫語者此為熱入血室但頭汗出者刺期門隨其實而瀉之濈然汗出則愈此陽明傳厥陰也此與上證皆因下後而致名越經傳經曰陽明少陽合病必下利其脈不負者順也負者失也互相剋賊名為負也脈滑而數者有宿食也當下之宜大承氣湯陽明土少陽木二經合病其脈長大而弦為負負者死長大不弦者為順宜下之以去少陽之邪脈滑而數為有宿食也經曰傷寒脈浮而緩手足自溫者是為系在太陰太陰者身當發黃若小便自利者不能發黃至七八日大便硬者為陽明病也此太陰之邪入腑轉屬陽明也若七八日下利者則脾家腐穢盡去不傳陽明今大便硬故知入胃腑也陽明病無汗小便不利心中懊憹者身必發黃此陽明自病也陽明病發熱汗出此為熱越不能發黃也但頭汗出身無汗齊頸而還小便不利渴飲水漿者此為瘀熱在裡身必發黃茵陳蒿湯主之周身汗出熱得外越也但頭汗身無汗則熱不得越矣小便自利熱不內蓄也小便不利渴飲水漿則熱甚於里矣胃屬土而色黃胃為熱蒸則色見於外必發黃也故用茵陳蒿湯以逐熱退黃傷寒六七日身黃如橘子色小便不利腹微滿者茵陳蒿湯主之身黃如橘子色熱甚於外也小便不利腹微滿熱甚於外而津液不得下行也火勝剋水故下之傷寒身黃發熱者梔子柏皮湯主之瘀熱在裡當須下去之此熱在表但宜解散之黃者土之色也太陰與陽明俱屬土其證外不得汗里不得小便脾胃之土為熱所蒸故色見於外為黃也傷寒發汗已身目為黃所以然者以寒濕在裡不解故也以為不可下也於寒濕中求之金匱要略曰黃家所起從濕得之汗出熱去則不能發黃今汗後身目反黃者風氣去濕氣在也若太陽證瘀血身黃者則可下此寒濕在裡故不可下當用茵陳五苓散治之傷寒瘀熱在裡身必發黃麻黃連翹赤小豆湯主之濕熱相交民多病癉癉黃也傷寒為寒濕在表發黃為瘀熱在裡故用此湯除熱散濕經曰陽明病口燥但欲漱水不欲咽者此必衄此陽明本經表病也脈浮發熱口乾鼻燥能食者則衄此二條均為熱甚於經迫血為衄也經曰陽明病反無汗而小便利二三日嘔而咳手足厥者必苦頭痛若不咳不嘔手足不厥者頭不痛此陽明本經傷寒而寒氣內攻之證也經曰陽明病但頭眩不惡寒故能食而咳其人必咽痛若不咳者咽不痛此陽明本經中風而風氣內攻之證也經曰夫實則譫語虛則鄭聲鄭聲重語也此陽明本經入里虛實之證也陽明經禁忌不可犯經曰陽明病本自汗出醫更重發汗病已瘥尚微煩不了了者此大便必硬故也以亡津液胃中乾燥故令大便硬當問其小便日幾行若本小便日三四行今日再行故知大便不久出今為小便數少以津液當還入胃中故知不久必大便也凡不大便若有潮熱譫語痞滿實痛者可下之無諸下證只是津液不足當須自便所謂不更衣十日無苦也發汗多若重發汗者亡其陽譫語脈短者死脈自和者不死傷寒四五日脈沉而喘滿沉為在裡而反發其汗津液越出大便為難表虛里實久則譫語此三條皆犯不可發汗之禁而強與發汗之變證也脈陽微而汗出少者為自和也汗出多者為太過陽脈實因發其汗出多者亦為太過太過為陽絕於里亡津液大便因硬也此二條正言所以不可發汗之由也經曰陽明病若中寒不能食小便不利手足濈然汗出此欲作痼瘕必大便初硬後溏所以然者以胃中冷水穀不別故也陽明病不能食攻其熱必嘔所以然者胃中虛冷故也以其人本虛故攻其熱必嘔上證不可攻攻之則利不止此證不可攻攻之則噦以胃中虛冷故也陽明病脈遲食難用飽飽則微煩頭眩必小便難此欲作谷疸雖下之腹滿如故所以然者脈遲故也此熱未實下之太早不能除病也傷寒嘔多雖有陽明證不可攻之嘔者熱在上焦未全入腑故不可下食谷欲嘔者屬陽明也吳茱萸湯主之得湯反劇者屬上焦也此陽明證似少陽者也食谷欲嘔客寒在胃也故主吳茱萸若嘔不止反加甚者屬少陽也小柴胡湯主之陽明病心下硬滿者不可攻之攻之利遂不止者死利止者愈此三條皆言陽明經病傳少陽之證也為在半表半裡未全入腑故不可下陽明病面合赤色不可攻之必發熱色黃小便不利也二陽並病論曰設面色緣緣正赤者陽氣怫鬱在表也此面合赤色乃熱在經當用葛根湯微發之攻之則經中之熱乘虛入胃也陽明病下之心中懊憹而煩胃中有燥屎者可攻腹微滿初頭硬後必溏不可攻之若有燥屎者宜大承氣湯無燥屎者梔子豉湯陽明病自汗出若發汗小便自利者此為津液內竭雖硬不可攻之當須自欲大便宜蜜煎導而通之若土瓜根及與大豬膽汁皆可為導趺陽脈浮而澀浮則胃氣強澀則小便數浮澀相搏大便則難其脾為約麻仁丸主之此上十條皆言不可下之禁也經曰陽明病汗出多而渴者不可與豬苓湯以汗多胃中燥豬苓湯複利其小便故也此條言不可利小便之禁也汗出多而渴白虎加人參湯經曰陽明中風口苦咽乾腹滿微喘發熱惡寒脈浮而緊若下之則腹滿小便難也發熱惡寒病在表也口苦咽乾腹滿微喘病在裡也當和解之不可下也陽明病脈浮而緊咽燥口苦腹滿而喘發熱汗出不惡寒反惡熱身重此證與上相類但上則無汗惡寒此則有汗惡熱當與和解之若發汗則燥心憒憒反譫語若加燒針必怵惕煩躁不得眠若下之則胃中空虛客氣動膈心中懊憹舌上苔者梔子豉湯主之此下後邪氣客於上焦為虛煩故吐之若渴欲飲水口乾舌燥者白虎加人參湯主之此下後邪熱客於中焦為燥渴故潤之若脈浮發熱渴欲飲水小便不利者豬苓湯主之此下後邪熱客於下焦面三焦俱帶熱也故利之少陽經脈證治法經曰少陽之病口苦咽乾目眩也內經曰三日少陽受之少陽主膽其脈循脅絡於耳故胸脅痛而耳聾少陽者足膽甲風木也此經行身之側後有太陽專主乎表前有陽明專主乎里在於表裡之間故曰不從標本從乎中治也太陽之本寒陽明之本熱少陽居其中乃有寒熱往來之症少陽之脈起於目銳眥復從耳後入耳中出走耳前下胸循脅裡出氣街乃有目眩耳聾胸脅痛之證內經曰有病口苦者名曰癉甲乙經曰五臟取決於膽咽為之使所以有口苦咽乾之證也自陽明傳來者名循經傳自太陽傳來者名越經傳有本經自受病者亦能傳經併入胃腑也其脈弦經曰尺寸俱弦者少陽受病也其證耳聾目眩胸脅痛寒熱嘔而口苦咽乾為在半表半裡宜和解之惟小柴胡湯一湯更無別方按十二經絡惟少陽膽經絡縈纖盤屈出入循行其支別所踞多於各經何證治之獨少也蓋經絡所踞足太陽在後表病多足陽明在前里病多汗下分屬二經該之盡矣少陽在二經之間既無表之可汗又無里之可下只有半表半裡之證和解一法而已也雖雲和解一法實兼統乎太陽陽明未可少其法而輕議之也經曰血弱氣盡腠理開邪氣因入與正氣相搏結於脅下正邪分爭往來寒熱休作有時默默不欲飲食臟腑相連其痛必下邪高痛下故使嘔也小柴胡湯主之此言少陽本經自受病也少陽屬膽無出入之道不宜汗下惟柴胡半夏能利能汗消解血熱黃芩佐之也又膽為清淨之腑其湯去滓再煎取其清以入膽也經曰本太陽病不解轉入少陽者脅下硬滿乾噦不能食往來寒熱尚未吐下脈沉緊者與小柴胡湯此言太陽在經之邪越經而傳少陽也蓋未經吐下而脈沉緊為傳裡雖深未至入腑猶宜和解若曾經吐下脈沉緊者此邪氣入腑為裡實宜大柴胡湯下之也按大柴胡湯證汗之則里已急下之則表未解故以小柴胡中藥兼表裡而和解之加芍藥以安太陰使邪氣不納以大黃去地道之不通以枳實去胸脅之痞滿也少陽傳經合病欲解脈證治法經曰傷寒六七日無大熱其人躁煩者此為陽去入陰故也此言少陽傳經之邪復傳於三陰也陽去入陰者表為陽里為陰言表邪盡傳於入里也經曰傷寒三日三陽為盡三陰當受邪其人反能食而不嘔此為三陰不受邪也此言少陽傳經之邪不傳三陰只在陽經自病也經曰服柴胡湯已渴者屬陽明也以法治之此言少陽本經之邪入胃腑也經曰三陽合病脈浮大上關上但欲眠睡目合則汗前三陽合病以證分此三陽合病以脈分也關脈以候少陽之氣太陽之脈浮陽明之脈大脈浮大上關上知三陽合病也凡欲眠睡目合無汗者此少陰證也目合則汗者此名盜汗乃少陽證也膽熱則睡經曰傷寒三日少陽脈小者欲已也此言傳經之邪至少陽而微為自己也少陽禁忌不可犯經曰少陽中風兩耳無所聞目赤胸中滿而煩者不可吐下吐下則悸而驚此少陽本經自中風之證也宜小柴胡湯不可吐下吐下為犯禁故以吐除煩吐則傷氣氣虛者悸以下除滿下則亡血血虛者驚治悸以小柴胡湯加茯苓炙草治驚以小柴胡湯加龍骨牡蠣也經曰傷寒脈弦細頭痛發熱者屬少陽少陽不可發汗發汗則譫語此屬胃胃和則愈胃不和則煩而悸此少陽本經自傷寒之證也不可發汗汗之為犯禁汗則譫語此屬胃乃少陽之邪入胃腑也謂之少陽陽明當與調胃承氣湯以和胃氣則愈經曰若已吐下發汗溫針譫語柴胡湯證罷此為壞病知犯何逆以法治之凡小柴胡怔吐下發汗後柴胡證不罷者則不為逆柴胡證罷者此為逆乃壞病也
