body:
  text: 卷之下太陰經脈證治法經曰太陰之為病腹滿而吐食不下自利益甚時腹自痛內經曰四日太陰受之太陰脈布胃中絡於嗌故腹滿而嗌乾自利太陰者足脾己濕土也此經布腹中貫胃上膈絡咽連舌本故有腹滿或痛吐利嗌乾之證主營四末又有四肢煩疼之證脾屬土其色黃又有發黃之證其經寒熱所分不可混治如本經自受病為直中太陰之寒證由三陽遞傳至太陰者為傳邪之熱證故自少陽傳者為循經傳自太陽傳者為誤下傳若本經亦能循經傳又入腑也凡病自陽經發者為外感風寒邪從表入則太陽先受之病自陰經起者為內傷生冷飲食過多則太陰先受之其脈沉而細經曰尺寸俱沉細者太陰受病也沉細而強疾者為實為熱當下強疾謂有力也沉細而遲弱者為虛為寒當溫遲弱謂無力也此二者里證見脈也若太陰本經自受風寒者其脈浮遲弱其證腹滿咽乾手足自溫發黃者屬熱此傳經之邪熱也自利不渴或嘔吐腹常痛者屬寒此直中太陰之邪也若外感風寒者四肢煩疼經曰太陰病脈浮者可發汗宜桂枝湯此太陰本經自受風寒之邪也其病在經屬表故宜汗之不言證者經中已言四肢煩疼是也桂枝太陰經表藥也中有芍藥甘草酸甘相合甲己化土故入脾也經曰自利不渴者屬太陰以其臟有寒故也當溫之宜四逆輩此太陰本經自受之寒邪也其病在臟屬裡故宜溫之凡自利而渴者屬少陰為寒在下焦自利不渴者屬太陰為寒在中焦不言脈者當知沉遲而弱也不言四逆湯但言四逆輩蓋太陰自利不渴者師言用理中湯甚者理中湯加附子其言輩者不過如此夫四逆甘辛相合乃大熱之劑苟輕用之恐有過度之失所以漢守不為定投也莫若以理中湯循次而用之更穩如不得已四逆方可用也經曰本太陽病醫反下之因爾腹滿時痛者屬太陰也桂枝加芍藥主之此言太陽證誤下而傳太陰也太陽原受病脈緩有汗當用桂枝湯醫反下之邪因乘虛傳於太陰裡氣不和表邪未罷故腹滿時痛四肢沉重宜桂枝湯加芍藥以解表和里大實痛者桂枝加大黃湯主之經曰大滿大實堅有燥屎者自可除下之此承上證而言非本有實證以其誤下脾復傳胃故用桂枝湯加大黃以除下之也太陰入腑欲解脈證經曰太陰中風四肢煩疼陽微陰澀而長者為欲愈此言太陽本經自中風之表證也表少里和脈長者為陽漸生也陰得陽則解故為欲愈經曰傷寒脈浮而緩手足自溫者系在太陰太陰當發身黃若小便自利不能發黃至七八日雖暴煩下利日十餘行必自止以脾家實腐穢當去故也此言太陰傳經之邪不入胃腑自愈之證也邪在三陽則手足熱邪在三陰則手足寒今手足自溫則知屬太陰也太陰病小便不利者身當發黃發黃者茵陳蒿湯主之至七八日小便自利大便必硬大便硬者為太陰入腑傳於陽明也調胃承氣湯主之今暴煩下利則知脾氣和遂下泄不復再傳也太陰禁忌不可犯經曰太陰之為病腹滿而吐食不下自利益甚時腹自痛若下之必胸下結硬此陽邪傳裡之證也太陰之脈布胃中邪氣壅而為腹滿上不得降者嘔吐而食不下下不得升者自利益甚凡陰寒在裡而為腹痛者則常痛不止此陽邪於裡但時時痛而不常也此證未至於實不可使下下之胸下結硬者下之早也經曰病發於陰而反下之因作痞此之謂也太陰為病脈弱其人續自便利設當行大黃芍藥者宜減之以其人胃氣弱易動故也此言太陰傳經里病腹滿痛者設當用桂枝湯加芍藥大黃須當審其脈證不可輕忽也如脈沉細有力便實者不可減少脈弱便調不減用之則下利不止此其宜禁也少陰經脈證治法經曰少陰之為病脈微細但欲寐也內經曰五日少陰受之少陰脈貫腎絡於肺系舌本故口燥舌乾而渴少陰者足腎癸水也其本寒位坎而屬寒水也其標熱配離而同君火也此經水火統論寒熱分治須要明辨今以本經自中者為寒證陽經傳入者為熱證庶幾可曉自太陰者為循經傳自太陽傳者為表傳裡若本經受病亦能傳經又入腑也經中首論並內經所言皆傳經之證也六經同其脈沉經曰尺寸俱沉者少陰受病也脈沉疾有力者為熱當下脈沉遲無力者為寒當溫經又言脈微細者以陽邪傳裡深也亦以遲疾分寒熱其證口燥舌乾而渴者大便實胸腹硬痛或下利清水者俱是邪在裡也口中和不渴者無熱惡寒厥冷蜷臥吐利臍腹絞痛者俱是陰寒在裡也凡三陰證但喜厚衣便是惡寒凡傷寒一時初起不入太陽竟入少陰無頭疼身熱便惡寒蜷臥四肢厥冷或腹痛自利小便清白脈沉遲弱微細無力或伏不見此陰寒直中少陰之真陰證也在經者宜溫發之在臟者宜溫補之經曰少陰病始得之反發熱脈沉者麻黃附子細辛湯主之此少陰本經自受風寒之證也為邪在經屬表故宜汗之麻黃附子細辛湯乃少陰經表藥也少陰本無熱故云反少陰病得之二三日麻黃附子甘草湯微發汗以二三日無里證故微發汗也此承上證而言若得之二三日只發熱脈沉無他證者病還在經不可用前湯發汗當改用此湯以散發汗也按上證發熱為邪在表而當汗脈沉屬陰而當溫故以附子溫經麻黃散寒而熱須汗解故加細辛乃汗劑之重者也下證既無裡寒之可溫又無裡熱之可下求其所用麻黃附子之意則是脈亦沉方可名曰少陰病身亦發熱方可行發表藥又得之二三日邪氣尚淺比上始得病亦稍輕故不重言脈證而但曰微發汗所以去細辛加甘草是汗劑又輕者向使脈不沉身不熱又無他證是為無病人也又何治焉少陰病得之二三日以上心中煩不得臥黃連阿膠湯主之此承上第一證而言若得之二三日以上身熱已除復心中煩不得臥者乃邪入於裡上合於心寒極變熱心惡熱而煩不得臥也若入於腎則喜寐矣可見心腎同經寒熱兼化此足傳手也故用黃連阿膠湯扶陰散熱少陰病得之二三日口中和其背惡寒者當灸之附子湯主之此亦承上第一證而言若得之二三日身熱已除復背惡寒者此少陰在經之邪隨經而傳於太陽經太陽證背惡寒口中燥者為熱邪故用白虎湯此證口中和里無熱也故用附子湯以溫經散寒可見臟腑相配表裡相通此里傳表也按此四證乃陰寒直中少陰者分為四證而治亦不同其間兼化相通之理輕重緩急之宜悉可知焉經曰少陰病身體痛手足寒骨節痛脈沉者附子湯主之此陰寒直中少陰真陰證也若脈浮則屬太陽麻黃湯證今脈沉知屬少陰也蓋少陰與太陽為表裡證同脈異也經曰少陰病脈沉者急溫之宜四逆湯此陰寒直中少陰之脈也少陰病寒邪在經者則發之在裡者則溫之並未云急此云急溫者彼雖寒甚而證已形治之則有成法此初頭脈沉未有形證不知邪氣所之將發何病是以急溫之也故用四逆湯此以上皆少陰直中陰寒而無吐利者之證治也經曰少陰病二三日至四五日腹痛小便不利下利不止便膿血者桃花湯主之此少陰自受寒邪而下利之證也為病在裡屬臟凡陽病下利便膿血者協熱也少陰下利便膿血裡寒也裡寒何以有膿血也蓋二三日至四五日寒邪變熱迫血下行血流腐而為膿下焦不闔故大便注下也桃花湯赤石脂以固脫粳米以補正氣乾薑以散腎之寒而闔下焦也成注未明經曰少陰病吐利手足厥冷煩躁欲死者吳茱萸湯主之此少陰自受寒邪而傳厥陰之證也為循經傳乃母傳子也吳茱萸湯厥陰肝經藥也故知經曰少陰病下利脈微者與白通湯利不止厥逆無脈乾嘔煩者白通加豬膽汁湯主之服湯脈暴出者死微續者生此陰寒直中少陰本臟為真陰證也腎主水為胃之關開竅於二陰寒氣中之不能閉藏出納故少陰證多吐利也按白通湯加豬膽汁人尿者內經啟玄子注曰若調寒熱之逆冷熱兼行則熱物冷服下嗌之後冷體既消熱性便發由是病氣隨愈嘔噦皆除情且不違而致大益此加二物鹹苦寒於白通湯熱劑中要其氣相從可以去格拒之寒也少陰病下利清穀裡寒外熱手足厥逆脈微欲絕身反不惡寒其人面赤色或腹痛或乾嘔或咽痛或利止脈不出者通脈四逆湯主之此證大略與上證同乃陰證似陽者也此以上皆治裡寒吐利之證也按白通湯姜附加蔥白為脈沉細而微澀姜附以治寒蔥白之辛以潤之為腎惡燥也何以知其脈之微澀也經曰少陰病下利脈微澀必數更衣白通湯治下利不止故知四逆湯姜附加甘草為脈遲細而遲弦姜附以治寒甘草之甘以緩之為肝苦急也何以知脈之遲弦也經曰少陰病飲食入口則吐手足寒脈遲弦者宜四逆湯故知也經曰少陰病二三日不已至四五日腹痛小便不利四肢沉重疼痛自下利者此為有水氣其人或咳或小便利或下利或嘔者真武湯主之此少陰自病兼有水氣者也水氣氾濫故有或為之證按太陽表證有水氣者小青龍湯少陰里證有水氣者真武湯六經中惟腎膀胱主水故二經有水氣之證也凡先見陽病傳經至少陰者口燥咽乾而渴腹脹不大便或自利純清水心下硬痛脈沉細有力此傳經之邪熱也宜下之若無口乾燥腹脹滿大便實之證宜和解之若吐利脈沉細無力者又當溫之也經曰少陰病得之二三日口燥咽乾者急下之宜大承氣湯此少陰經自受邪即與手經相合或太陽經病即與少陰同病是名兩感而獨盛於少陰曰二三日熱之急也口燥咽乾邪甚也熱甚於里煎熬真陰腎精幹涸故宜急下以救腎水也少陰病自利清水色純清心下必痛口乾燥者急下之宜大承氣湯此少陰之邪傳厥陰也難經曰從前來者為實邪自利色青肝乘腎也心下痛燥屎也宜急下少陰病六七日腹脹不大便者急下之宜大承氣湯此少陰入陽明胃腑也胃土也腹脹不大便地道不通胃土壅塞也急下之以去土之墩阜救水之枯涸也此上皆下證經曰少陰病四逆其人或咳或悸或小便不利或腹中痛或泄利下重者四逆散主之此陽經所傳之證也凡邪在三陽則手足必熱傳到太陰則手足必溫至少陰則邪熱漸深故四肢逆而不溫也及至厥陰則手足厥冷又甚於四逆矣四逆散少陰和解藥也少陰病下利六七日咳而嘔渴心煩不得眠者豬苓湯主之此陽邪所傳挾熱而利也是二證者既無裡虛之可溫又無裡實之可下所以和解之也經曰少陰病欲吐不吐心煩但欲寐五六日自利而渴屬少陰也虛故引水自救若小便色白者少陰病形悉具小便白者以下焦虛有寒不能制水故令色白也此太陰循經傳少陰之證凡自利不渴者屬太陰理中湯證自利而渴者屬少陰豬苓湯證此不確者以小便別之色黃為熱色白為寒也少陰病飲食入口則吐心中溫溫欲吐復不能吐始得之手足寒脈弦遲者此胸中實不可下也當吐之若膈上有寒飲乾嘔者不可吐也急溫之宜四逆湯此亦表邪傳裡之證也凡吐而有物者為傳裡之邪留於胸中宜瓜蒂散吐之乾嘔無物者為膈上有寒飲宜四逆湯溫之上證以小便分寒熱此證以嘔吐分虛實通用四逆湯溫之四逆湯乃少陰里證虛寒溫補之藥也辨少陰咽痛脈證治法經曰病人脈陰陽俱緊反汗出者亡陽也此屬少陰法當咽痛而復吐利此少陰似太陽之證也脈陰陽俱緊乃太陽傷寒法當無汗麻黃湯證是也今反汗出知屬少陰傷寒也少陰傷寒法當咽痛而復吐利蓋少陰之脈循喉嚨寒氣客之必發咽痛腎司開闔少陰治在下焦寒邪內盛則開闔不治下焦不約吐而又下利也用四逆湯治之此少陰自受寒邪之病故溫之經曰少陰病下利咽痛胸滿心煩者豬膚湯主之此傳經之熱邪也少陰病咽中傷生瘡不能語言聲不出者苦酒湯主之此傳經之熱傷於絡脈也此二證皆陽經傳入少陰之客熱也故解之經曰少陰病二三日咽痛者可與甘草湯不瘥者與桔梗湯少陰病咽中痛半夏散及湯主之此二證皆傳經之邪也甘草湯主少陰客熱咽痛桔梗湯主少陰寒熱相搏咽痛半夏散主少陰客寒咽痛也少陰傳經欲解可治不可治脈證經曰少陰病八九日一身手足盡熱者以熱在膀胱必便血也此少陰之邪復傳太陽也膀胱太陽也少陰太陽為表裡傳下血乃愈血不下小腹硬痛者宜抵當湯主之經曰少陰病脈緊至七八日自下利脈暴微手足反溫脈緊反去者為欲解也雖煩下利必自愈也此少陰傷寒欲解之候也凡下利煩躁者死惟太陰暴煩下利為脾實腐穢當去也此少陰為正勝邪微手足反溫脈緊反去也少陰中風脈陽微陰浮者為欲愈此少陰中風欲解之候也經曰少陰病下利若利自止惡寒而蜷臥手足溫者可治少陰病惡寒而蜷時自煩欲去衣被者可治少陰病吐利手足不逆冷反發熱者不死脈不至者灸少陰七壯此三證可治者一以利自止手足溫也一以時自煩欲去衣被也一以手足不逆冷反發熱也經曰少陰病惡寒身蜷而利手足逆冷者不治以利而手足逆冷也少陰病吐利躁煩四逆者死此吐利躁煩而死者以四逆也少陰病下利止而頭眩時時自冒者死陽病冒者為欲汗解陰病冒者死少陰病四逆惡寒而身蜷脈不至不煩而躁者死以四逆無脈也少陰病六七日息高者死此少陰邪入於裡上接於心與火俱化而克肺金故息高死少陰病脈微細沉但欲臥汗出不煩自欲吐至五六日自利復煩躁不得臥寐者死此以脈微細沉正氣久虛也少陰禁忌不可犯經曰少陰病脈細沉數病為在裡不可發汗宜用大承氣湯下之少陰病脈微不可發汗亡陽故也陽已虛尺脈弱澀者復不可下之脈微者為陽虛不可發汗汗之則亡陽尺脈弱澀者為陰虛不可下下之則亡陰宜四逆湯經曰少陰病咳而下利譫語者被火氣劫故也小便必難以強責少陰汗也太陽中風被火劫亦譫語小便難表裡同也二經有此火逆小便利者可治少陰病但厥無汗而強發之必動其血未知從何道出或從口鼻或從目出是名下厥上竭為難治此二證皆犯強發少陰汗之禁按六經證治惟少陰傳變與太陽相同如通脈四逆湯四逆散真武湯證俱有加減法謂有或為之證亦由太陽小青龍小柴胡之類是也蓋足少陰腎也足太陽膀胱也二經相為表裡故其證亦相通少人知斯妙也厥陰經脈證治法經曰厥陰之為病消渴氣上撞心心中疼熱飢而不欲食食則吐蛔內經曰六日厥陰受之厥陰脈循陰器而絡於肝故煩滿而囊縮厥陰者足肝乙木此經獨在六經之後傷寒六七日傳至厥陰為傳經盡凡經中與內經所序六經之證皆傳經之邪不可與本經自受病者例論也蓋厥陰自受病者乃直中陰經之真陰證也其病為寒傳經至厥陰者其病為熱間有寒者吐利久與醫之誤也所以厥陰經亦有寒熱兩端當分治之自少陰傳者為實邪母傳子也自太陽傳者為循經得度傳三陰不至於頭惟厥陰與腎脈上行至巔與太陽相接也至厥陰復傳太陽為自愈不愈為再經其脈微緩而沉經曰尺寸俱微緩者厥陰受病也脈沉實而疾者為熱宜下脈沉弱而遲者為寒宜溫經又言脈微緩者以熱邪內甚兼風化也緩者風脈也肝為風木若脈沉緩為病未已若得浮緩之脈浮則邪還於表緩則脾胃氣和不再受克邪無所容否極泰來水升火降必寒熱作而出汗解也此言傳經盡後脈也其證煩滿囊縮舌卷耳聾消渴手足乍冷乍溫者為熱惡寒口吐涎沫頭痛小腹痛自利不渴手足冷為寒若發熱惡寒似瘧不嘔清便自調為欲愈此言傳經盡後證也凡初病更無熱惡寒四肢厥冷頭痛面清身如被杖小腹絞痛囊縮口吐涎沫或下利小便清白脈沉遲微弱尋之似有按之全無此厥陰本經受寒之真陰證也在經在臟俱用通脈四逆湯治之經曰手足厥寒脈細欲絕者當歸四逆湯主之若其人內有久寒者宜當歸四逆加吳茱萸生薑湯主之此厥陰自受寒之真陰證也為病在經凡六經中俱稱某經病某經傷寒惟厥陰不稱經者或居六經之後脈證獨殊故不稱歟乾嘔吐涎沫頭痛者吳茱萸湯主之此厥陰本經自病表裡兼有之證也經曰下利腹脹滿身體疼痛者先溫其里乃攻其表溫里四逆湯攻表桂枝湯此陰經傷寒之證表裡俱急者也三陰同論經曰傷寒脈微而厥至七八日膚冷其人躁無暫安時者此為臟厥非為蛔厥也蛔厥者其人當吐蛔今病者靜而復時煩此為臟寒蛔上入膈故煩須臾復止得食而嘔又煩者蛔聞食臭出其人當自吐蛔蛔厥者烏梅丸主之又主久利此厥陰本經自傷寒也為病在臟若不吐躁無暫安時者此名臟厥臟厥者死陽氣絕也宜四逆輩冷服之若吐蛔時躁時靜此名蛔厥宜烏梅丸傷寒脈促手足厥逆者可灸之此厥陰本經傷寒之脈也凡先病自陽經續傳至厥陰者消渴煩滿舌卷耳聾囊縮脈微緩者囊不縮脈沉短者囊縮腹痛後重大便稠黏小便赤澀或大便閉或自利譫語脈沉實急數此傳經之邪熱也宜攻之亦有大吐下發汗後或吐利久而成虛寒之證脈亦沉遲微弱當與厥陰自受寒者同論不可誤攻之也經曰傷寒脈滑而厥者里有熱也白虎湯主之此陽明經熱傳厥陰也病人手足厥冷脈乍緊者邪結在胸中心中滿而煩飢不能食者病在胸中當須吐之宜瓜蒂散此少陰病傳厥陰也與少陰可吐證同熱利下重者白頭翁湯主之此陽邪入里協熱而利也下利慾飲水者以有熱故也白頭翁湯主之此與少陰自利而渴相似凡自利不渴為臟寒與四逆湯以溫臟下利飲水為有熱與白頭翁湯以涼中下利後更煩按之心下濡者為虛煩也宜梔子豉湯此太陽合病自利後之證也凡病在陽經者方可謂之邪氣乘虛客於胸中若傳至陰經不宜有是虛煩之證矣但下利後不煩為欲解若更煩而心下堅者則為谷煩此皆陰經利後之證今以煩而心下濡知為陽經利後之虛煩也故吐之下利譫語者有燥屎也宜小承氣湯此厥陰入胃腑也下利者水滲出也厥陰之病消渴飲水多其水自腸間滲漏而出故利清水也其證必煩滿而脈沉實此以上皆傳經之熱邪也經曰大汗出熱不去內拘急四肢疼又下利厥逆而惡寒者四逆湯主之此言汗後亡陽傳厥陰也大汗若大下利而厥冷者四逆湯主之此言汗下後陽虛陰勝傳厥陰也經曰傷寒本自寒下醫復吐下之寒格更逆吐下若食入口即吐乾薑黃連黃芩人參湯主之此證醫之咎也厥陰證異於六經者以厥逆吐利也所以別經則稱某經病而厥陰不稱經者以有厥逆吐利可識也今以厥逆吐利分其寒熱脈證各為一類庶有頭緒也經曰凡厥者陰陽氣不相順接便為厥厥者手足逆冷是也此言厥之由也凡病發於陽而後厥者謂之陽厥陽厥者陽氣內陷熱氣逆伏而手足為之冷也病發於陰而後厥者謂之陰厥陰厥者陽氣不足而陰氣勝也其厥必上過於肘下過於膝針經曰陰氣起於五指之裡趨於膝下而聚於膝上故陰氣勝則從五指至膝上寒此之謂也大抵厥逆為陰所主寒者多矣厥為陰之盛也若更加之惡寒而蜷者陰氣之極也則難於制治陰厥以四逆湯治陽厥以四逆散陽厥復有可下者以脈沉實而證煩滿囊縮也經曰傷寒始熱六日厥反九日而利凡厥利者當不能食今反能食者恐為除中食以索餅不發熱者知胃氣尚在必愈恐暴熱來出而復去也後三日脈之其熱續在者期之旦日夜半愈所以然者本發熱六日厥反九日復發熱三日並前六日亦為九日與厥相應故期之旦日夜半愈後三日脈之而脈數其熱不罷者此為熱氣有餘必發癰膿也此以下皆言陽厥之證也此條恐為除中食以索餅恐熱復去其熱續在脈數熱盛必發癰膿凡三候也傷寒一二日至四五日而厥者必發熱前熱者後必厥厥深者熱亦深厥微者熱亦微厥應下之而反發汗者必口傷爛赤此言厥應下之者手足或有溫時或手足掌心必暖證必煩滿脈必沉實故下之否則不可下也傷寒熱少厥微指頭寒默默不欲食煩躁數日小便利色白者此熱除也欲得食其病為愈若厥而嘔胸脅煩滿者其後必便血厥而嘔胸脅煩滿者大柴胡湯證也厥應下之亦宜此湯便血者桃仁承氣湯傷寒發熱四五日厥反三日復熱四日厥少熱多其病當愈四日至七日熱不除者其後必便膿血此四條皆陽厥也凡陽厥熱不除在表者必發癰膿在裡者必便膿血者以肝主血而風木易動也其脈皆數便膿血黃芩湯經曰傷寒先厥後發熱而利者必自止見厥複利此以下皆言陰厥也傷寒先厥後發熱下利必自止而反汗出咽中痛者其喉為痹發熱無汗而利必自止若不止必便膿血便膿血者其喉不痹陰氣勝則厥而利陽氣復則發熱而利止汗出而咽中痛者熱氣上行也桔梗湯無汗而便膿血者桃花湯傷寒病厥五日熱亦五日設六日當復厥不厥者自愈厥終不過五日以熱五日故知自愈厥為陰氣勝也熱為陽氣復也傷寒厥四日熱反三日復厥五日其病為進寒多熱少陽氣退故進也此證宜服四逆湯此四條皆陰厥之證也經曰嘔而脈弱小便複利身有微熱見厥者難治四逆湯主之此證即東垣所謂子能令母實自東之比為逆行之證也乃厥陰肝經本臟病也屬寒嘔而發熱小柴胡湯主之此少陽之邪傳厥陰也屬熱嘔家有癰膿者不可治嘔膿儘自愈此厥陰木邪上干胃土也蓋胃與大腸皆屬陽明陽邪傳於厥陰厥陰肝經主血血為熱迫腐而為膿入胃則嘔膿血入大腸則下膿血皆厥陰傳陽明也傷寒噦而腹滿視其前後知何部不利利之則愈此陽邪也傷寒大吐大下之極虛復極汗出者以其人外氣怫鬱復與之水以發其汗因得噦所以然者胃中寒冷故也此以上皆言厥陰嘔噦脈證治法也經曰下利有微熱而渴脈弱者令自愈下利陰寒之疾脈大身熱者逆下利脈沉弦者下重也脈大者為未止脈微弱數者為欲自止雖發熱不死此發熱不為逆者以脈微弱為邪氣微而陽得復也下利脈數有微熱汗出令自愈設復緊為未解數乃陽脈緊乃陰脈下利手足厥冷無脈者灸之不溫若脈不還反微喘者死此通脈四逆湯證也下利寸脈反浮數尺中自澀者必清膿血此熱迫血下也下利脈沉而遲其人面少赤身有微熱下利清穀者必鬱冒汗出而解病人必微厥所以然者其面戴陽下虛故也下利清穀裡寒外熱汗出而厥者通脈四逆湯主之上證同方下利脈數而渴者令自愈設不瘥必清膿血以有熱故也下利後脈絕手足厥冷晬時脈還手足溫者生脈不還者死傷寒四五日腹中痛轉氣下趨少腹者此欲自利也傷寒厥而心下悸者宜先治水當服茯苓甘草湯卻治其厥不爾水漬八胃必作利也此以上皆言厥陰下利脈證治法也厥陰傳經欲解可治不可治脈證經曰病者手足厥冷言我不結胸小腹滿按之痛者此冷結在膀胱關元也此厥陰寒邪內傳太陽膀胱也傷寒六七日大下後寸脈沉而遲手足厥逆下部脈不至咽喉不利唾膿血泄利不止者為難治麻黃升麻湯主之此邪傳厥陰以下後而傳於太陰之證也金匱要略曰肺痿之病從何得之被快藥下利重亡津液故得之經曰厥陰中風脈微浮為欲愈不浮為未愈此陰病見陽脈者生也厥陰病渴欲飲水者少少與之愈經曰凡得病反能飲水此為欲愈之病經曰發熱而厥七日下利者為難治此難治者以七日經盡不汗出而解反下利也經曰傷寒六七日脈微手足厥冷煩躁灸厥陰厥不還者死傷寒發熱下利厥逆躁不得臥者死傷寒發熱下利至甚厥不止者死傷寒六七日不利便發熱而利其人汗出不止者死有陰無陽故也傷寒下利日十餘行脈反實者死難經曰脈不應病病不應脈是為死病厥陰禁忌不可犯經曰厥陰之為病消渴氣上撞心心中疼熱飢而不欲食食則吐蛔下之利不止邪自太陽傳至太陰則腹滿而嗌乾未成渴也邪至少陰者口燥舌乾而渴未成消也至厥陰成消渴者熱甚能消水也飲水多而小便少者謂之消渴此證下後吐下不止者烏梅丸主之經曰諸四逆厥者不可下之虛家亦然厥逆為陰邪所主不可下亦不可汗也傷寒五六日不結胸腹濡脈虛復厥者不可下此為亡血下之死金匱玉函曰虛者十補勿一瀉之虛者下之真氣乃絕此四逆湯證也下利清穀不可攻表汗出必脹滿此四逆湯證也先溫其里後攻其表治法也經曰傷寒脈遲六七日而反與黃芩湯徹其熱脈遲為寒今與黃芩湯復除其熱腹中應冷當不能食今反能食此名除中必死中胃氣也邪氣太甚除去胃氣胃欲引食自救故暴能食四時皆以胃氣為本胃氣已絕故死六經傳盡後論解經曰其不兩感於寒更不傳經不加異氣者至七日太陽病衰頭痛少愈也八日陽明病衰身熱少歇也九日少陽病衰耳聾微聞也十日太陰病衰腹減如故則思飲食十一日少陰病衰渴止舌乾已而退也十二日厥陰病衰囊縮少腹微下大氣皆去病人精神爽慧也此言大略也傷寒有循經傳者有越經傳者有始終只在一經者有始在陽經即傳陰經者有在經即入腑者入腑不復再傳矣信如經言前六日以次而傳後六日以次而衰則前後合併陰陽混雜脈證難辨而治法莫知適從也況太陽病未罷復傳陽明者謂之並病陽經與陰經同病者謂之兩感但聞三陽並病未聞並於三陰者病兩感者六日死未聞延至十二日也夫六經傳變太陽傳陽明太陽證罷也陽明傳少陽陽明證罷也陽去入陰少陽之證亦罷也傳至太陰只太陰一經病傳至少陰只少陰一經病傳厥陰只厥陰一經病病至厥陰其經已盡邪之輕者調理不乖者六日之後邪氣漸衰正氣漸復其病愈矣若邪或甚或醫之咎病且不間將為再經或在於陽或在於陰安可必其如前六日以次再傳耶經之所序蓋云以是經得病亦以是經病終也數其日者自當發之日計之皆得六日也管見如斯識者擇之也按經中所序六經之證專主乎足未及手之六經遂使有傷寒傳足不傳手之說殊不知手之三陽接於足之三陽足之三陰接於手之三陰上下周流脈絡通貫風寒之中未有不俱受病者不明乎此故謂只傳足經不傳手經也且如太陽病發熱小腸也陽明病鼻乾大腸也少陽病耳聾三焦也太陰病嗌乾肺也少陰病舌乾口燥心也厥陰病舌卷煩渴心包絡也以類求之斯如傷寒之邪手經亦有之矣六經汗下論解經曰此三經皆受病未入於腑者可汗而已三經謂太陽陽明少陽也內經曰其未滿三日可汗而已三陽受病未入於腑可汗而已雖云可汗自有輕重太陽自有諸汗法如陽明多用桂枝解之少陽則無可汗之理若欲解表但用小柴胡加薑桂也如太陽病雖十日去表證不罷者猶為一日也太陽有一二日入於腑者即可下之謂表證罷入里也又不可拘以日數陽明少陽同法經曰此三陰皆受病已入於腑可下而已三陰謂太陰少陰厥陰也內經曰其滿三日可泄而已三陰受病已入於腑可下而已三陰亦有在經未入腑者可汗之如太陰腹痛稍稍惡寒既是表證未罷宜桂枝先解表然後下之如又譫語舌黑發狂尚喜厚衣微惡寒者即不可下先當解表已而下之有欲作汗目暝發狂身自冷者又不可汗汗則有汗之法王氏曰證應隨脈升沉而汗下之不可拘以日數蓋六經者俱有表裡二證但有表證即發汗但有里證即宜下或表裡二證俱見陽證便實者先解其表後攻其里陰證下利者先救其里後攻其表病在半表半裡者和解之內經曰謹察陰陽所在而調之以平為期此之謂也傷寒瘥後陰陽易勞食復諸證治法經曰傷寒陰陽易之為病其人身體重少氣少腹裡急或引陰中拘攣熱上衝胸頭重不欲舉眼中生花膝脛拘急者燒褌散主之男子病新瘥餘邪未盡而婦人與之交婦人因得病者謂之陽易婦人病新瘥餘邪未盡而男子與之交男子因得病者謂之陰易曰易者以陰陽相感動其餘邪毒氣相傳染者如換易也亦由其人正氣本虛故能相易不然安得受其邪哉然女犯男得病鮮有死者男犯女得病治之稍緩則無及矣與燒褌散以導陰氣小便得利陰頭微腫者愈凡男子大病新瘥津液虛耗精血枯竭切不可為房事若強合陰陽內損真氣外動邪熱而復病者此女勞復非易病也其證亦與易病相似急以根猳鼠矢湯調燒褌散救之以黏汗為效少緩必舌出而死故曰諸勞則可及御女即死矣經曰大病瘥後勞復者枳實梔子豉湯主之若有宿食者加大黃如博棋子大五六枚梔子豉湯吐劑也熱聚於上苦則吐之熱散於表苦則發之也傷寒新瘥氣血未平餘熱未盡早作動勞病者名曰勞復謂之勞者非但強力搖體持重遠行也凡言語思慮勞神梳浴洗頹勞力勞則生熱而復病也此勞復者熱氣浮越與枳實梔子豉湯以解之若頭痛四肢疼者葛根蔥豉湯其病熱少愈而強食之熱有所藏因其穀氣留薄兩陽相合而病者名曰食復內經曰病熱少愈食肉則復多食則傷言新瘥後腸胃尚弱多食則難消化而復病如初矣此食復者胃有宿積加大黃以下之舉其數者戒多用也經曰病人脈已解而日暮微煩以病新瘥人強與谷脾胃氣尚弱不能消穀故令微煩損谷則愈病微者減損穀食病甚者尤當損谷凡瘥後不因勞食復而有不了了證者責邪之未盡也經曰傷寒瘥之後更發熱者小柴胡湯主之脈浮者以汗解之脈沉實者以下解之脈浮者熱在表小柴胡加桂枝湯脈沉者熱在裡小柴胡加芒硝湯經曰大病瘥後從腰以下有水氣者牡蠣澤瀉散主之此因飲水太多脾胃氣虛不能制水溢於下焦而為腫也金匱要略云腰以下腫當利小便經曰大病瘥後喜唾久不了了者胃上有寒當以丸藥溫之宜理中丸此汗後胃虛者也大抵傷寒瘥後有未盡之證者皆脾胃氣弱不能平復也經曰傷寒解後虛羸少氣氣逆欲吐者竹葉石膏湯主之又傷寒瘥後終不惺惺常昏沉似失精神言語錯謬或無寒熱有似鬼祟或朝夕潮熱頰赤或有寒熱如瘧狀此乃發汗不盡餘毒留在心包絡間所致也宜知母麻黃湯傷寒兩感證論解經曰若兩感於寒者一日太陽受之即與少陰俱病則頭痛口乾煩滿而渴二日陽明受之即與太陰俱病則腹滿身熱不欲食譫語三日少陽受之即與厥陰俱病則耳聾囊縮而厥水漿不入不知人者六日死若三陰三陽五臟六腑俱受病則營衛不行腑臟不通則死矣臟腑俱病表裡俱傷名為兩感始得一日頭痛者太陽也口乾煩滿而渴者少陰也太陽腑也其邪自背俞而入少陰臟也其邪自鼻息而入內經曰天之邪氣感則害人五臟鼻氣通於天故寒邪無形之氣從鼻而入也此太陽少陰兩感邪氣則兩證俱見至於傳經亦陰陽兩經俱傳也二日太陽傳於陽明身熱譫語陽明也少陽傳於太陰腹滿不欲食太陰也三日陽明傳於少陽耳聾者少陽也太陰傳於厥陰囊縮而厥厥陰也不言脈者素問已說大抵陰脈必沉一日脈當沉而大二日脈當沉而長三日脈當沉而弦仲景不立治法者內經曰其兩感於寒而病者必不免於死以表裡雙傳妨於汗下故不立法也然所稟有虛實所感有淺深虛而感之深者必死實而感之淺者猶或可治活人書乃引下利身疼痛虛寒救里之例欲施於煩渴腹滿譫語囊縮熱實之證以火濟火豈不悖亂耶至易老乃立大羌活湯以解初在太陽少陰之證誠發前人之所未發也今之醫者初見是證多忽之而莫辨以頭痛煩滿而渴視為常有之證用藥輕緩或誤投湯藥致令死者多矣凡傷寒初病不渴至次日而渴者傳經入里之邪也中暍即渴者以自汗也下利即渴嘔吐即渴者亡津液也非此兩感無汗吐利而始病即渴也經云兩感治有先後攻裡發表本自不同謂太陽少陰先發汗而後下之陽明太陰表裡雙攻少陽厥陰先下之而後汗之雖有此治然無瘥理病在太陽少陰迅速治療如易老之法尤或有生病在陽明太陰已難治療至於少陽厥陰雖神醫亦莫能及之矣傷寒成溫暑感異氣變他病脈證治法經曰中而即病者名曰傷寒不即病者寒毒藏於肌膚至春變為溫病至夏變為暑病暑病者熱極重於溫也內經曰先夏至日為溫病後夏至日為暑病溫暑之病本傷於寒而得之治溫暑不可發汗過時而發不在表也此下言溫暑證經曰太陽病發熱而渴不惡寒者為溫病此以脈浮不屬陽明也又發於春經曰太陽中熱者暍是也其人汗出惡寒身熱而渴以脈虛又在夏經曰若更感異氣變為他病者當依舊壞病證而治之先本傷寒病熱未解又感其時別異乖戾之氣兩邪相合變為他病既非傳經之證又非入腑之證當與發汗吐下後壞病同論觀其時令脈證知犯何氣隨證治之也此蓋冬時即病之傷寒當論異氣若春夏則為溫暑不可謂之傷寒矣經曰若脈陰陽俱盛重感於寒者變為溫瘧難經曰傷寒之脈陰陽俱盛而緊澀前病熱未已再感於寒寒熱相搏變為溫瘧其證寒熱往來責在少陽小柴胡湯主之此下皆言變病也經曰陽脈浮滑陰脈濡弱者更遇於風變為風溫難經曰中風之脈陽浮而滑陰濡而弱前熱未已又感於風風來乘熱變為風溫其證四肢不收頭疼身熱常自汗出責在足厥陰本手少陰火宜萎蕤湯發汗復身灼熱知母葛根湯渴者瓜蔞根湯誤汗風溫防己黃耆湯若發汗已身灼熱者名曰風溫風溫為病脈陰陽俱浮自汗出身重多眠睡鼻息必鼾語言難出若被下者小便不利直視失溲若被火者微發黃色劇則如驚癇時瘈瘲若火熏之一逆尚引日再逆促命期此太陽病汗後而變風溫之證也經曰陽脈洪數陰脈實大者遇溫熱變為溫毒溫毒為病最重也此前熱未已又感溫熱兩熱相合變為溫毒專責乎少陰心火表裡俱熱為病最重宜玄參升麻湯經曰陽脈濡弱陰脈弦緊者更遇溫氣變為溫疫以此各傷於寒發為溫病脈之變證方治如說此前熱未已又感溫氣溫熱相合變為溫疫經曰從立春節後其中無暴大寒又不水雪而有人壯熱為病者此屬春時陽氣發於冬時伏寒變為溫病此為溫病羌活湯傷寒冬溫伏氣時行疫病證論經曰其冬有非節之暖者名曰冬溫冬溫之毒與傷寒大異冬溫復有先後更相重沓亦有輕重為治不同此時行之病經曰凡時行者春時應暖而復大寒夏時應大熱而反大涼秋時應涼而反大熱冬時應寒而反大溫此非其時而有其氣是以一歲之中長幼之病多相似者此則時行之氣也四時氣候不正為病謂之時行之氣此天行時氣病也與傷寒溫暑寒疫之證不同經曰從春分以後至秋分節前天有暴寒者皆為時行寒疫也三月四月或有暴寒其時陽氣尚弱為寒所折病發尚輕五月六月陽氣已盛為寒所折病熱則重七月八月陽氣已衰為寒所折病熱亦微其病與溫及暑病相似但治有殊耳此言四時寒疫之由也以上溫病時行寒疫不言脈證者難經曰各隨其經所在而取之是也經曰伏氣之病以意候之冬月之內欲有伏氣假令舊有伏氣當須脈之若脈微弱者常喉中痛似傷非喉痹也病人云實咽中痛雖爾今復欲下利此隨經所在而取之法也冬時感寒伏藏於經中不即發者謂之伏氣伏氣欲發當須脈之審在何經假如脈微弱者知邪在少陰也余仿此推之痙濕暍脈證治法經曰傷寒所致太陽痙濕暍三種宜應別論以為與傷寒相似故此見之痙病有二剛痙為陽與太陽傷寒相似柔痙為陰與太陽中風相似其不同者脈沉而細獨頭面搖卒口噤背反張也中濕與太陽傷寒相似不同者脈沉而細頭汗面黃能飲食也中暍與太陽中風相似不同者脈微弱遲細初病即渴也三種脈亦相似而證不同暍則自汗而渴濕則不渴身疼痙則身不疼也經曰太陽病發熱無汗反惡寒者名曰剛痙此太陽中風重感於寒也太陽病發熱汗出不惡寒者名曰柔痙此太陽中風重感於濕也太陽中風重感寒濕乃變為痙無汗曰剛痙葛根麻黃湯有汗曰柔痙桂枝加葛根湯口噤咬牙者大承氣湯太陽病發熱脈沉而細者名曰痙此言痙脈也若脈浮大為中風傷寒矣病身熱足寒頸項強急惡寒時頭熱面赤目脈赤獨頭面搖卒口噤背反張者痙也此言痙證也風寒濕邪客於太陽之經則筋脈拘縮而成痙也身熱足寒者寒濕傷下也頭熱面赤目脈赤風傷於上也此以上皆言痙證也經曰太陽病關節疼痛而煩脈沉而細者濕痹之候其人小便不利大便反快但當利其小便此言濕痹之證也痹者痛也金匱要略曰霧傷皮腠濕流關節濕則關節疼以五苓散利其小便古云治濕之病不利小便則非其治也濕家之為病一身盡疼發熱身色如似熏黃此濕邪在經治在脾也身黃如橘子色者此陽明瘀熱也梔子柏皮湯身黃如似熏黃者此太陰濕在經也五苓散加茵陳湯濕家其人但頭汗出背強欲得被複向火若下之早則噦胸滿小便不利舌上如苔者以丹田有熱胸中有寒渴欲得水而不能飲則口燥煩也此寒濕相搏之證也宜發汗濕家下之額上汗出微喘小便利者死若下利不止者亦死濕家發汗則愈金匱要略曰濕家身煩疼可與麻黃加朮四兩發其汗為宜若妄下則大逆濕家病身上疼痛發熱面黃而喘頭痛鼻塞而煩其脈大自能飲食腹中和無病病在頭中寒濕故鼻塞納藥鼻中則愈此有濕氣淺者也成註明白宜細末瓜蒂含水搐少許鼻中問曰風濕相搏一身盡疼痛法當汗出而解值天陰雨不止醫云此可發汗汗之病不愈者何也答曰發其汗汗大出者但風氣去濕氣在是故不愈也若治風濕相搏者發其汗但微微似欲汗出者風濕俱去是也此風濕相搏之治法也病者一身盡疼發熱日晡所劇者此名風濕此病於汗出當風或久傷取冷所致也此風濕相搏之證也汗出當風而得之者此先受濕而後感風久傷取冷得之者此先傷風而後中濕可與麻黃杏仁薏苡仁甘草湯治之風濕相搏骨節煩疼掣痛不得屈伸近之則痛劇汗出短氣小便不利惡風不欲去衣或身微腫者甘草附子湯主之風則傷衛濕流關節風濕相搏兩邪亂經故為是證也此與下證皆太陽篇中取附於此傷寒八九日風濕相搏身體疼煩不能自轉側不嘔不渴脈浮虛而澀者桂枝附子湯主之若其人大便硬小便自利者去桂枝加白朮湯主之此風濕在經之證也浮虛風脈也澀者寒濕脈也叔和曰陽脈濡弱陰脈弦緊更遇溫氣變為濕溫嘗傷於溫因而中暑濕熱相搏發而為病其證兩脛逆冷胸腹滿目痛壯熱妄言自汗名曰濕溫治在太陰不可發汗汗出則不能言耳聾不知痛所在身青而色變名曰重暍如此者醫殺之也濕溫之證數進白虎則脛自溫而瘥此證與前風溫溫瘧溫毒四證即叔和所謂同病異名同脈異經者也蓋風溫與中風脈同溫瘧與傷寒脈同濕溫與中濕脈同溫毒與熱病脈同唯證候異而用藥有殊耳誤作傷寒發汗者十無一生此以上皆濕證也經曰太陽中暍者身熱疼腫而脈微弱此亦夏月傷冷水水行皮中所致也此本時所得之病非冬傷於寒至夏變為暑之病也乃夏時暑熱以水灌洗而得之一物瓜蒂散主之若暑病則用河間之法而治之太陽中暍者發熱惡寒身重而疼痛其脈弦細芤遲小便已洒洒然毛聳手足逆冷小有勞身即熱口開前板齒燥若發汗則惡寒甚加溫針則發熱甚數下之則淋甚此證表裡俱受熱而病也宜白虎湯大抵暑熱之病不可發汗汗之為大逆下之其逆小也此以上皆言暍證也霍亂脈證治法問曰病有霍亂者何答曰嘔吐而利名曰霍亂此釋霍亂之名也三焦者水穀之道路邪在上焦則吐而不利邪在下焦則利而不吐邪在中焦則既吐且利以飲食不節寒熱不調清濁相干陰陽乖隔遂成霍亂輕者只曰吐利重者揮霍撩亂名曰霍亂問曰病發熱頭痛身疼惡寒吐利者此屬何病答曰此名霍亂自吐又利且復更發熱也此言霍亂之證也經曰霍亂頭痛發熱身疼痛熱多欲飲水者五苓散主之寒多不用水者理中丸主之此霍亂兼風寒之證治也中焦為陰陽相半之分中焦不治陰陽乖隔必有偏之者偏陽則多熱渴欲飲水也偏陰則多寒不用水也理中丸有加減法吐利者而身痛不休者當消息和解其外宜桂枝湯小和之承上證言分寒熱治後吐利得止身痛不休者此里和表未解也必汗出而解經曰惡寒脈微而複利利止亡血也四逆加人參湯主之此以下證專屬於寒者也利止非愈以津液內竭無所利故止也故云亡血以四逆湯溫經助陽加人參生津液益血吐利汗出發熱惡寒四肢拘急手足厥冷者四逆湯主之既吐且利小便複利而大汗出下利清穀內寒外熱脈微欲絕者四逆湯主之此吐利危惡之候也脈微為亡陽內寒下利清穀為純陰若無外熱難治吐已下斷汗出而厥四肢拘急不解脈微欲絕者通脈四逆加豬膽汁湯主之此陽氣大虛陰氣獨盛亦危惡之證也若純與陽藥恐陰為格拒或嘔或躁不得復入也與通脈四逆湯加豬膽汁膽苦入心而通脈膽寒補肝而和陰引置陽藥不為格拒從治之法也經曰傷寒其脈微澀者本是霍亂今是傷寒卻四五日至陰經上轉入陰必利本嘔下利者不可治也欲似大便而反失氣仍不利者屬陽明也便必硬十三日愈所以然者經盡故也凡霍亂吐利止傷寒之邪未已還是傷寒若五日陽去入陰之時再吐利者謂之重虛不可治也其大便硬者為屬陽明經盡則愈者以陰陽之氣和大邪之氣去也下利後當便硬硬則能食者愈今反不能食到後經中頗能食復過一經能食過之一日當愈不愈者不屬陽明也此承上文而言經盡則愈者以能食也若能食病復不愈者此暴熱使之能食非陽明氣和也經曰吐利發汗脈平小煩者以新虛不勝穀氣故也損谷則愈傷寒將理法並諸死脈論經曰凡傷寒之病多從風寒得之始表中風寒入里則不消矣未有溫復而當不消散者不在證治擬欲攻之猶當先解表乃可下之若表已解而內不消非大滿猶生寒熱則病不除若表已解而內不消大滿大實堅有燥屎自可除下之雖四五日不能為禍也若不宜下而使攻之內虛熱入協熱遂利煩躁諸變不可勝數輕者困篤重者必死矣經曰陰盛陽虛汗之則死下之則愈陽虛陰盛汗之則愈下之則死桂枝下咽陽盛則斃承氣入胃陰盛以亡經曰凡發汗溫服湯藥其方雖言日三服若病劇不解當促其間可半日中盡三服若與病相阻即便有所覺病重者一日一夜當晬時觀之如服一劑病證猶在故當復作本湯服之至有不肯汗出服三劑乃解若汗不出者死病也經曰凡服下藥用湯勝丸中病即止不必盡劑也經曰凡得時氣病至五六日而渴欲飲水飲不能多不當與也何者以腹中熱尚少不能消之便更與人作病也至七八日大渴欲飲水者猶當依證與之與之常令不足勿極意也言能飲一斗與五升若飲而腹滿小便不利若喘若噦不可與之忽然大汗出是為自愈也凡得病反能飲水此為愈之病其不曉病者但聞病飲水自愈小渴者乃強與之因成其禍不可複數經曰凡得病厥脈動數服湯藥更遲脈浮大減小初躁後靜此皆愈證也經曰凡傷於寒則為病熱熱雖盛不死若兩感於寒而病者必死經曰脈陰陽俱盛大汗出不解者死此名陰陽交也脈陰陽俱虛熱不止者死凡脈至乍疏乍數者死此革脈也脈至如轉索者其日死譫言妄語身微熱脈浮大手足溫者生逆冷脈沉細者不過一日死經曰脈浮而洪身汗如油喘而不休水漿不入體形不仁乍靜乍亂此為命絕也
